name: nais

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: nais/api:dev
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["${NAIS_GATEWAY_PORT:-21051}:21051", "21056:21056", "21057:21057"]
    volumes:
      - ./infra/nginx/nais.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on: [api]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:21051/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *api-image
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *api-image
    command: ["python", "-m", "api.worker"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nais
      POSTGRES_USER: ${POSTGRES_USER:-nais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nais}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["21055:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nais -d nais"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "nais", "--user", "nais", "on", ">nais", "~*", "&*", "+@all"]
    ports: ["21058:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nais", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["osdata:/usr/share/opensearch/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:21051/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-nais}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-nais}
    volumes: ["./infra/keycloak/import:/opt/keycloak/data/import:ro"]
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["./infra/opa/policies:/policies:ro"]
    restart: unless-stopped

  storage-a:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/start-storage.sh"]
    environment:
      S3_ACCESS_KEY: ${STORAGE_INST_A_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_INST_A_SECRET_KEY}
    volumes:
      - storage-a:/data
      - ./infra/docker/storage/start-storage.sh:/start-storage.sh:ro
    ports: ["21053:8333"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  storage-b:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/start-storage.sh"]
    environment:
      S3_ACCESS_KEY: ${STORAGE_INST_B_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_INST_B_SECRET_KEY}
    volumes:
      - storage-b:/data
      - ./infra/docker/storage/start-storage.sh:/start-storage.sh:ro
    ports: ["21054:8333"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_UI_AUTH: "nais:nais"
    ports: ["21052:8025"]
    restart: unless-stopped

volumes:
  pgdata:
  osdata:
  storage-a:
  storage-b:
