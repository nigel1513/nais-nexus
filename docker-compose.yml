name: nais

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: nais/api:dev
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["${NAIS_GATEWAY_PORT:-21051}:21051", "21056:21056", "21057:21057"]
    volumes:
      - ./infra/nginx/nais.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./infra/nginx/opensearch-auth.conf:/etc/nginx/opensearch-auth.conf:ro
    depends_on: [api]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:21051/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *api-image
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *api-image
    command: ["python", "-m", "api.worker"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_MOCKING: ${WEB_API_MOCKING:-enabled}
    image: nais/web:dev
    env_file: .env
    environment:
      # Runtime must match the build arg (env_file's NEXT_PUBLIC_API_MOCKING=disabled is for Wave 2).
      NEXT_PUBLIC_API_MOCKING: ${WEB_API_MOCKING:-enabled}
      AUTH_TRUST_HOST: "true"
      NAIS_EXTERNAL_HOST: ${NAIS_EXTERNAL_HOST:-localhost}
      AUTH_ALLOWED_HOSTS: ${AUTH_ALLOWED_HOSTS:-localhost:21051}
      # NAIS_JUPYTER_* / NAIS_INTERNAL_TOKEN come from env_file (.env); only the in-network api URL is fixed here.
      NAIS_INTERNAL_API_URL: http://api:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One shared JupyterLab (M07-lite). Only reachable through the gateway at /notebooks/ (no published port).
  # Fails closed: an empty NAIS_JUPYTER_TOKEN would disable Jupyter auth, so the container refuses to start.
  notebook:
    image: quay.io/jupyter/scipy-notebook:lab-4.6.4
    environment:
      NAIS_JUPYTER_TOKEN: ${NAIS_JUPYTER_TOKEN:-}
    command:
      - sh
      - -c
      - >-
        test -n "$$NAIS_JUPYTER_TOKEN" || { echo "NAIS_JUPYTER_TOKEN is empty (set it in .env)" >&2; exit 1; };
        exec start-notebook.py
        --ServerApp.base_url=/notebooks/
        --IdentityProvider.token="$$NAIS_JUPYTER_TOKEN"
        --ServerApp.terminals_enabled=False
        --ServerApp.allow_remote_access=True
        --ServerApp.trust_xheaders=True
        --ServerApp.root_dir=/home/jovyan
    volumes:
      - notebookwork:/home/jovyan/work
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/notebooks/api', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nais
      POSTGRES_USER: ${POSTGRES_USER:-nais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nais}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["21055:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nais -d nais"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "nais", "--user", "nais", "on", ">nais", "~*", "&*", "+@all"]
    ports: ["21058:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nais", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    build: infra/opensearch
    image: nais-opensearch:2.19.1-nori
    environment:
      discovery.type: single-node
      # 보안 플러그인 켬 (2026-10-02): 계정 인증, HTTP 유지(전송 계층만 데모 인증서 TLS)
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?set OPENSEARCH_ADMIN_PASSWORD}
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["osdata:/usr/share/opensearch/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9200/ | grep -qE '200|401'"]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${NAIS_PUBLIC_BASE_URL:-http://localhost:21051}/auth
      NAIS_EXTERNAL_HOST: ${NAIS_EXTERNAL_HOST:-localhost}  # substituted into realm-nais.json at import
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-nais}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-nais}
    volumes: ["./infra/keycloak/import:/opt/keycloak/data/import:ro"]
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["./infra/opa/policies:/policies:ro"]
    restart: unless-stopped

  storage-a:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/start-storage.sh"]
    environment:
      S3_ACCESS_KEY: ${STORAGE_INST_A_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_INST_A_SECRET_KEY}
    volumes:
      - storage-a:/data
      - ./infra/docker/storage/start-storage.sh:/start-storage.sh:ro
    ports: ["21053:8333"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  storage-b:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/start-storage.sh"]
    environment:
      S3_ACCESS_KEY: ${STORAGE_INST_B_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_INST_B_SECRET_KEY}
    volumes:
      - storage-b:/data
      - ./infra/docker/storage/start-storage.sh:/start-storage.sh:ro
    ports: ["21054:8333"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_UI_AUTH: "nais:nais"
    ports: ["21052:8025"]
    restart: unless-stopped

volumes:
  pgdata:
  osdata:
  storage-a:
  storage-b:
  notebookwork:
