  schemas:
    # ---------- shared
    Id: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: { type: string, examples: ["ACCESS_GRANT_EXPIRED"] }
            message: { type: string }
            trace_id: { type: string }
            details: { type: object, additionalProperties: true }
    PageEnvelope:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: {} }
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks: { type: object, additionalProperties: { type: string, enum: [ok, down] } }

    # ---------- enums
    ActiveStatus: { type: string, enum: [ACTIVE, DISABLED] }
    OrganizationType: { type: string, enum: [RESEARCH_INSTITUTE, UNIVERSITY, COMPANY, PLATFORM_OPERATOR] }
    OrgRole: { type: string, enum: [ORG_ADMIN, DATA_STEWARD, RESOURCE_MANAGER] }
    PlatformRole: { type: string, enum: [PLATFORM_ADMIN] }
    ProjectRole: { type: string, enum: [PROJECT_OWNER, PROJECT_ADMIN, RESEARCHER, VIEWER] }
    ProjectStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    ProjectVisibility: { type: string, enum: [PRIVATE, PUBLIC] }
    AccessLevel: { type: string, enum: [PUBLIC, INTERNAL, CONTROLLED, SENSITIVE] }
    Purpose: { type: string, enum: [ACADEMIC_RESEARCH, AI_TRAINING, COMMERCIAL_RESEARCH, EDUCATION, PUBLIC_INTEREST] }
    Operation: { type: string, enum: [READ, COMPUTE, WRITE], description: "P0 grantable: READ only (D-009)" }
    DatasetStatus: { type: string, enum: [ACTIVE, WITHDRAWN] }
    DatasetVersionStatus: { type: string, enum: [DRAFT, PUBLISHED, WITHDRAWN] }
    FileStatus: { type: string, enum: [PENDING, UPLOADED, VERIFIED, FAILED] }
    AccessRequestStatus: { type: string, enum: [DRAFT, SUBMITTED, UNDER_REVIEW, CHANGE_REQUESTED, APPROVED, REJECTED, WITHDRAWN] }
    AccessGrantStatus: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }
    ReadinessRunStatus: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED] }
    ReadinessOverall: { type: string, enum: [PASS, WARNING, FAIL] }
    ReadinessCheckStatus: { type: string, enum: [PASS, WARNING, FAIL, NOT_APPLICABLE] }
    ResourceType: { type: string, enum: [USER, ORGANIZATION, MEMBERSHIP, PROJECT, PROJECT_MEMBER, DATASET, DATASET_VERSION, DATASET_FILE, ACCESS_REQUEST, ACCESS_GRANT, READINESS_VALIDATION,
                                         PROJECT_INPUT, RECIPE, RUN, OUTPUT, PUBLISH_REQUEST, THREAD, RESEARCH_NOTE] }
    AuditAction:
      type: string
      enum: [LOGIN, USER_CREATED, ORGANIZATION_CREATED, ADMIN_ROLE_CHANGED, PROJECT_CREATED, PROJECT_ARCHIVED, PROJECT_MEMBER_ADDED, PROJECT_MEMBER_REMOVED, PROJECT_MEMBER_ROLE_CHANGED,
             DATASET_CREATED, DATASET_VERSION_PUBLISHED, DATASET_UPDATED, POLICY_CHANGED, ACCESS_REQUESTED, ACCESS_REVIEW_STARTED, ACCESS_APPROVED, ACCESS_REJECTED, ACCESS_CHANGES_REQUESTED, ACCESS_WITHDRAWN,
             ACCESS_REVOKED, ACCESS_EXPIRED, FILE_DOWNLOADED, DOWNLOAD_DENIED, READINESS_VALIDATION_COMPLETED,
             PROJECT_INPUT_ADDED, PROJECT_INPUT_VERSION_CHANGED, PROJECT_INPUT_REMOVED, RECIPE_SAVED, RUN_SUCCEEDED, RUN_FAILED, OUTPUT_CREATED,
             OUTPUT_PUBLISH_REQUESTED, OUTPUT_PUBLISH_DECIDED, COMMENT_ADDED, NOTE_SUBMITTED, NOTE_SIGNED, NOTE_REJECTED, NOTE_VIEWED]
    NotificationType:
      type: string
      enum: [PROJECT_INVITATION, ACCESS_SUBMITTED, ACCESS_APPROVED, ACCESS_REJECTED, ACCESS_CHANGES_REQUESTED, ACCESS_EXPIRING, ACCESS_REVOKED, DATASET_PUBLISHED,
             OUTPUT_PUBLISH_REQUESTED, OUTPUT_PUBLISH_DECIDED, NOTE_SUBMITTED, NOTE_REJECTED, NOTE_SIGNED, DATASET_COMMENT_ADDED]

    # ---------- identity read models
    IdentityPublicProfile:
      type: object
      required: [user_id, display_name, organization_id, status]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        organization_id: { $ref: "#/components/schemas/Id" }
        organization_name: { type: string }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        national_researcher_number: { type: [string, "null"], pattern: "^[0-9]{8}$" }
    OrganizationSummary:
      type: object
      required: [organization_id, code, name, type]
      properties:
        organization_id: { $ref: "#/components/schemas/Id" }
        code: { type: string, pattern: "^[a-z0-9-]{2,32}$", examples: ["inst-a"] }
        name: { type: string }
        type: { $ref: "#/components/schemas/OrganizationType" }
    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationSummary"
        - type: object
          properties:
            ror_id: { type: [string, "null"], description: "P2 extension" }
            homepage_url: { type: [string, "null"], format: uri }
            member_count: { type: integer }
            dataset_count: { type: integer }
            created_at: { $ref: "#/components/schemas/Timestamp" }
    OrganizationMembership:
      type: object
      required: [user_id, organization_id, roles, status]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        organization_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" } }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
    Me:
      type: object
      required: [user_id, display_name, email, status, organization, org_roles, platform_roles]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        org_roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" } }
        platform_roles: { type: array, items: { $ref: "#/components/schemas/PlatformRole" } }
        national_researcher_number: { type: [string, "null"], pattern: "^[0-9]{8}$" }

    MeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        national_researcher_number: { type: [string, "null"], pattern: "^[0-9]{8}$", description: "NTIS 국가연구자번호; null clears" }
    UserTransfer:
      type: object
      additionalProperties: false
      required: [organization_id]
      properties:
        organization_id: { $ref: "#/components/schemas/Id" }
        roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" }, uniqueItems: true, default: [] }
    # ---------- projects
    ProjectSummary:
      type: object
      required: [project_id, name, status, lead_organization_id, visibility]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        visibility: { $ref: "#/components/schemas/ProjectVisibility" }
        lead_organization_id: { $ref: "#/components/schemas/Id" }
        my_role: { oneOf: [ { $ref: "#/components/schemas/ProjectRole" }, { type: "null" } ] }
        lead_organization_name: { type: string }
        member_count: { type: integer }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          required: [description, organizations, created_at]
          properties:
            description: { type: string }
            keywords: { type: array, items: { type: string } }
            start_date: { type: [string, "null"], format: date }
            end_date: { type: [string, "null"], format: date }
            organizations:
              type: array
              items:
                type: object
                required: [organization_id, role]
                properties:
                  organization_id: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  role: { type: string, enum: [LEAD, PARTNER], description: "PARTNER rows are derived from members' organizations" }
            created_by: { $ref: "#/components/schemas/Id" }
            created_at: { $ref: "#/components/schemas/Timestamp" }
            archived_at: { type: [string, "null"], format: date-time }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        visibility: { $ref: "#/components/schemas/ProjectVisibility" }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 20 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        visibility: { $ref: "#/components/schemas/ProjectVisibility" }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 20 }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
    ProjectMember:
      type: object
      required: [project_id, user_id, organization_id, role, joined_at]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        organization_id: { $ref: "#/components/schemas/Id" }
        organization_name: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        joined_at: { $ref: "#/components/schemas/Timestamp" }
        added_by: { $ref: "#/components/schemas/Id" }

    # ---------- catalog
    DatasetPolicyView:
      type: object
      required: [dataset_id, owner_organization_id, access_level, allowed_purposes, approval_required, max_grant_days]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" }, minItems: 1 }
        approval_required: { type: boolean, description: "P0: always true for CONTROLLED/SENSITIVE; ignored for PUBLIC/INTERNAL" }
        max_grant_days: { type: integer, minimum: 1, maximum: 365, description: "SENSITIVE <= 30" }
    VocabularyScheme: { type: string, enum: [SUBJECT, METHOD, MATERIAL] }
    UpdateFrequency: { type: string, enum: [ONCE, MONTHLY, QUARTERLY, YEARLY, IRREGULAR] }
    ContributorRole: { type: string, enum: [CO_INVESTIGATOR, DATA_COLLECTOR, DATA_CURATOR] }
    VocabularyTerm:
      type: object
      required: [scheme, code, label_ko, label_en]
      properties:
        scheme: { $ref: "#/components/schemas/VocabularyScheme" }
        code: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }
        label_ko: { type: string }
        label_en: { type: string }
        iri: { type: [string, "null"], pattern: "^https?://\\S+$" }
        parent_code: { type: [string, "null"] }
    VocabularyTermCreate:
      type: object
      additionalProperties: false
      required: [code, label_ko, label_en]
      properties:
        code: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }
        label_ko: { type: string, minLength: 1, maxLength: 200 }
        label_en: { type: string, minLength: 1, maxLength: 200 }
        iri: { type: string, pattern: "^https?://\\S+$" }
        parent_code: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }
    OrganizationRef:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "null for an organization outside the council (free-text name)" }
        name: { type: string }
    DatasetPerson:
      type: object
      required: [user_id, display_name, status, affiliation]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        national_researcher_number: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        affiliation: { $ref: "#/components/schemas/OrganizationRef", description: "Organization at the time the person was assigned (당시 소속)" }
        current_organization: { oneOf: [ { $ref: "#/components/schemas/OrganizationRef" }, { type: "null" } ], description: "Current organization (null if unknown)" }
        email: { type: string, format: email, description: "Only on people.steward_contact and only when contact_email_public" }
    DatasetContributor:
      allOf:
        - $ref: "#/components/schemas/DatasetPerson"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/ContributorRole" }
    DatasetContributorsPut:
      type: object
      additionalProperties: false
      required: [contributors]
      properties:
        contributors:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [user_id, role]
            properties:
              user_id: { $ref: "#/components/schemas/Id" }
              role: { $ref: "#/components/schemas/ContributorRole" }
    DatasetPeople:
      type: object
      required: [principal_investigator, steward_contact, contributors, steward_contact_absent]
      properties:
        principal_investigator: { oneOf: [ { $ref: "#/components/schemas/DatasetPerson" }, { type: "null" } ] }
        steward_contact: { oneOf: [ { $ref: "#/components/schemas/DatasetPerson" }, { type: "null" } ] }
        contributors: { type: array, items: { $ref: "#/components/schemas/DatasetContributor" } }
        steward_contact_absent: { type: boolean, description: "Steward contact unset, disabled, or no longer a member of the owner organization (담당자 재지정 필요)" }
    RelatedPublication:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        doi: { type: string, pattern: "^10\\.\\d{4,9}/\\S+$" }
        url: { type: string, pattern: "^https?://\\S+$" }
    DatasetJsonLd:
      type: object
      required: ["@context", "@type", "@id", name]
      additionalProperties: true
      properties:
        "@context": { type: object }
        "@type": { type: array, items: { type: string } }
        "@id": { type: string, format: uri }
        name: { type: string }
    FilePreviewStatus: { type: string, enum: [PENDING, READY, FAILED, UNSUPPORTED] }
    ColumnProfile:
      type: object
      required: [name, type, missing_ratio, distinct_count]
      properties:
        name: { type: string }
        type: { type: string, enum: [string, integer, number, boolean, date, datetime], description: "Declared in _schema.json, else inferred from the sample" }
        unit: { type: [string, "null"] }
        description: { type: [string, "null"] }
        concept_iri: { type: [string, "null"] }
        missing_ratio: { type: number, minimum: 0, maximum: 1 }
        distinct_count: { type: integer, minimum: 0 }
        distinct_capped: { type: boolean, description: "true when distinct values exceeded the 1,000 counting cap (distinct_count is then a lower bound)" }
    FileProfile:
      type: object
      required: [file_id, path, status, columns]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        path: { type: string }
        status: { $ref: "#/components/schemas/FilePreviewStatus" }
        failure_code: { type: [string, "null"], enum: [UNPARSEABLE, TIMEOUT, GENERATION_FAILED, null] }
        generated_at: { type: [string, "null"], format: date-time }
        format: { type: string, enum: [csv, tsv, parquet] }
        rows_sampled: { type: integer }
        truncated: { type: boolean, description: "Sample stopped at the row/byte limit" }
        columns_truncated: { type: boolean }
        columns: { type: array, items: { $ref: "#/components/schemas/ColumnProfile" } }
    ColumnDistribution:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [numeric, categorical, other] }
        min: { type: [number, "null"] }
        max: { type: [number, "null"] }
        mean: { type: [number, "null"] }
        histogram:
          type: array
          items: { type: object, required: [lower, upper, count], properties: { lower: { type: number }, upper: { type: number }, count: { type: integer } } }
        top_values:
          type: array
          items: { type: object, required: [value, count], properties: { value: { type: string }, count: { type: integer } } }
    FilePreview:
      type: object
      required: [file_id, status, header, rows, rows_truncated, columns]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/FilePreviewStatus" }
        header: { type: array, items: { type: string } }
        rows: { type: array, maxItems: 100, items: { type: array, items: { type: [string, "null"], maxLength: 200 } } }
        rows_truncated: { type: boolean }
        columns: { type: array, items: { $ref: "#/components/schemas/ColumnDistribution" } }
    DatasetCreate:
      type: object
      additionalProperties: false
      required: [owner_organization_id, title, description, access_level, license, allowed_purposes, principal_investigator_id, data_steward_contact_id]
      properties:
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        title: { type: string, minLength: 3, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 30 }
        domain: { type: string, examples: ["materials", "bio", "energy"] }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        license: { type: string, examples: ["CC-BY-4.0", "NAIS-CONTROLLED-1.0"] }
        usage_policy: { type: string, maxLength: 10000 }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" }, minItems: 1, uniqueItems: true }
        max_grant_days: { type: integer, minimum: 1, maximum: 365, default: 180 }
        contact_email: { type: string, format: email }
        provenance: { type: string, maxLength: 10000, description: "How the data was produced (instrument, method, source)" }
        subtitle: { type: string, maxLength: 160, description: "One-line summary shown under the title (Data Card)" }
        principal_investigator_id: { $ref: "#/components/schemas/Id" }
        data_steward_contact_id: { $ref: "#/components/schemas/Id" }
        contact_email_public: { type: boolean, default: false }
        project_title: { type: string, maxLength: 300 }
        project_code: { type: string, maxLength: 64 }
        funding_agency: { type: string, maxLength: 200 }
        subject_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 5, uniqueItems: true }
        method_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 10, uniqueItems: true }
        material_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 20, uniqueItems: true }
        method_detail: { type: string, maxLength: 4000 }
        temporal_start: { type: string, format: date }
        temporal_end: { type: string, format: date }
        collecting_organization_id: { $ref: "#/components/schemas/Id" }
        collecting_organization_name: { type: string, minLength: 1, maxLength: 200 }
        update_frequency: { $ref: "#/components/schemas/UpdateFrequency" }
        related_publications: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RelatedPublication" } }
    DatasetUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 30 }
        domain: { type: string }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        license: { type: string }
        usage_policy: { type: string, maxLength: 10000 }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" }, minItems: 1, uniqueItems: true }
        max_grant_days: { type: integer, minimum: 1, maximum: 365 }
        contact_email: { type: string, format: email }
        provenance: { type: string, maxLength: 10000 }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        subtitle: { type: [string, "null"], maxLength: 160 }
        principal_investigator_id: { $ref: "#/components/schemas/Id" }
        data_steward_contact_id: { $ref: "#/components/schemas/Id" }
        contact_email_public: { type: boolean }
        project_title: { type: [string, "null"], maxLength: 300 }
        project_code: { type: [string, "null"], maxLength: 64 }
        funding_agency: { type: [string, "null"], maxLength: 200 }
        subject_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 5, uniqueItems: true }
        method_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 10, uniqueItems: true }
        material_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 20, uniqueItems: true }
        method_detail: { type: [string, "null"], maxLength: 4000 }
        temporal_start: { type: [string, "null"], format: date }
        temporal_end: { type: [string, "null"], format: date }
        collecting_organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        collecting_organization_name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        update_frequency: { $ref: "#/components/schemas/UpdateFrequency" }
        related_publications: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RelatedPublication" } }
    Dataset:
      type: object
      required: [dataset_id, owner_organization_id, title, description, access_level, license, policy, status, created_at, updated_at]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        owner_organization_name: { type: string }
        title: { type: string }
        description: { type: string }
        keywords: { type: array, items: { type: string } }
        domain: { type: [string, "null"] }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        license: { type: string }
        usage_policy: { type: [string, "null"] }
        contact_email: { type: [string, "null"] }
        provenance: { type: [string, "null"] }
        policy: { $ref: "#/components/schemas/DatasetPolicyView" }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        latest_published_version: { oneOf: [ { $ref: "#/components/schemas/DatasetVersionSummary" }, { type: "null" } ] }
        created_by: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        subtitle: { type: [string, "null"] }
        people: { $ref: "#/components/schemas/DatasetPeople" }
        contact_email_public: { type: boolean }
        project_title: { type: [string, "null"] }
        project_code: { type: [string, "null"] }
        funding_agency: { type: [string, "null"] }
        subject_codes: { type: array, items: { type: string } }
        method_codes: { type: array, items: { type: string } }
        material_codes: { type: array, items: { type: string } }
        method_detail: { type: [string, "null"] }
        temporal_start: { type: [string, "null"], format: date }
        temporal_end: { type: [string, "null"], format: date }
        collecting_organization: { oneOf: [ { $ref: "#/components/schemas/OrganizationRef" }, { type: "null" } ] }
        update_frequency: { $ref: "#/components/schemas/UpdateFrequency" }
        related_publications: { type: array, items: { $ref: "#/components/schemas/RelatedPublication" } }
        stats:
          type: object
          description: Derived from the latest published version (no input)
          properties:
            file_count: { type: integer }
            total_bytes: { type: integer }
            media_types: { type: array, items: { type: string } }
    DatasetVersionSummary:
      type: object
      required: [dataset_version_id, version_label, status]
      properties:
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        version_label: { type: string }
        status: { $ref: "#/components/schemas/DatasetVersionStatus" }
        published_at: { type: [string, "null"], format: date-time }
        readiness_overall:
          description: "Latest COMPLETED result of TABULAR_ML_BASIC if present, else GENERIC_BASIC; null if none"
          oneOf: [ { $ref: "#/components/schemas/ReadinessOverall" }, { type: "null" } ]
    DatasetVersion:
      allOf:
        - $ref: "#/components/schemas/DatasetVersionSummary"
        - type: object
          required: [dataset_id, files, file_count, total_bytes, created_at]
          properties:
            dataset_id: { $ref: "#/components/schemas/Id" }
            change_note: { type: [string, "null"] }
            files: { type: array, items: { $ref: "#/components/schemas/DatasetFile" } }
            file_count: { type: integer }
            total_bytes: { type: integer }
            manifest_sha256: { type: [string, "null"], description: "sha256 over sorted 'path\\tsize\\tsha256' lines; set on publish" }
            created_at: { $ref: "#/components/schemas/Timestamp" }
    DatasetFile:
      type: object
      required: [file_id, path, size_bytes, sha256, media_type, status]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        path: { type: string, pattern: "^[A-Za-z0-9._/-]{1,512}$", description: "Relative path, no '..' or leading '/'" }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        media_type: { type: string }
        status: { $ref: "#/components/schemas/FileStatus" }
    UploadSessionCreate:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [path, size_bytes, sha256, media_type]
            properties:
              path: { type: string, pattern: "^[A-Za-z0-9._/-]{1,512}$" }
              size_bytes: { type: integer, minimum: 1, maximum: 53687091200, description: "P0 per-file limit 50 GiB" }
              sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
              media_type: { type: string }
    UploadSession:
      type: object
      required: [upload_session_id, dataset_version_id, status, expires_at, files]
      properties:
        upload_session_id: { $ref: "#/components/schemas/Id" }
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [OPEN, COMPLETED, EXPIRED] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        files:
          type: array
          items:
            type: object
            required: [file_id, path, status]
            properties:
              file_id: { $ref: "#/components/schemas/Id" }
              path: { type: string }
              status: { $ref: "#/components/schemas/FileStatus" }
              failure_code: { type: [string, "null"] }
              upload:
                oneOf:
                  - type: object
                    required: [method, url]
                    properties:
                      method: { const: PUT }
                      url: { type: string, format: uri }
                      headers: { type: object, additionalProperties: { type: string } }
                  - type: object
                    required: [method, part_size_bytes, parts]
                    properties:
                      method: { const: MULTIPART }
                      part_size_bytes: { type: integer }
                      parts: { type: array, items: { type: object, required: [part_number, url], properties: { part_number: { type: integer }, url: { type: string, format: uri } } } }
    DatasetSearchHit:
      type: object
      required: [dataset_id, title, owner_organization_id, access_level]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        snippet: { type: string }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        owner_organization_name: { type: string }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        keywords: { type: array, items: { type: string } }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" } }
        latest_version_label: { type: [string, "null"] }
        readiness_overall: { oneOf: [ { $ref: "#/components/schemas/ReadinessOverall" }, { type: "null" } ] }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        subtitle: { type: [string, "null"] }
        principal_investigator_name: { type: [string, "null"] }
        temporal_start: { type: [string, "null"], format: date }
        temporal_end: { type: [string, "null"], format: date }
        subject_codes: { type: array, items: { type: string } }
        collecting_organization_name: { type: [string, "null"] }
    FacetBucket:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }
    DatasetSearchResult:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [total, facets]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/DatasetSearchHit" } }
            total: { type: integer }
            facets:
              type: object
              properties:
                access_level: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                owner_organization_id: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                purpose: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                keyword: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                readiness_status: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                subject: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                collecting_organization_id: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                material: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                method: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }

    # ---------- governance
    AccessRequestCreate:
      type: object
      additionalProperties: false
      required: [dataset_id, project_id, purpose, purpose_detail, operations, requested_days]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        purpose_detail: { type: string, minLength: 20, maxLength: 4000 }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" }, minItems: 1, uniqueItems: true }
        requested_days: { type: integer, minimum: 1, maximum: 365 }
    AccessRequest:
      type: object
      required: [access_request_id, dataset_id, project_id, requester_user_id, requester_organization_id, owner_organization_id, purpose, purpose_detail, operations, requested_days, status, created_at, updated_at]
      properties:
        access_request_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_title: { type: string }
        project_id: { $ref: "#/components/schemas/Id" }
        project_name: { type: string }
        requester_user_id: { $ref: "#/components/schemas/Id" }
        requester_display_name: { type: string }
        requester_organization_id: { $ref: "#/components/schemas/Id" }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        purpose_detail: { type: string }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        requested_days: { type: integer }
        status: { $ref: "#/components/schemas/AccessRequestStatus" }
        history:
          type: array
          items:
            type: object
            required: [status, at]
            properties:
              status: { $ref: "#/components/schemas/AccessRequestStatus" }
              at: { $ref: "#/components/schemas/Timestamp" }
              by_user_id: { $ref: "#/components/schemas/Id" }
              comment: { type: [string, "null"] }
        access_grant_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AccessApprove:
      type: object
      additionalProperties: false
      required: [grant_days]
      properties:
        grant_days: { type: integer, minimum: 1, maximum: 365, description: "<= requested_days and <= max_grant_days; expires_at = approved_at + grant_days" }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" }, minItems: 1, uniqueItems: true, description: "Subset of requested operations; default = requested" }
        note: { type: string, maxLength: 2000 }
    AccessDecisionResult:
      type: object
      required: [access_request]
      properties:
        access_request: { $ref: "#/components/schemas/AccessRequest" }
        access_grant: { oneOf: [ { $ref: "#/components/schemas/AccessGrant" }, { type: "null" } ] }
    AccessGrant:
      type: object
      required: [access_grant_id, subject_type, subject_user_id, project_id, dataset_id, purpose, operations, valid_from, expires_at, granted_by, policy_version, status]
      properties:
        access_grant_id: { $ref: "#/components/schemas/Id" }
        access_request_id: { $ref: "#/components/schemas/Id" }
        subject_type: { const: USER }
        subject_user_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_title: { type: string }
        subject_display_name: { type: string }
        project_name: { type: string }
        purpose: { $ref: "#/components/schemas/Purpose" }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        valid_from: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        granted_by: { $ref: "#/components/schemas/Id" }
        policy_version: { type: string, examples: ["data_access@1.0.0"] }
        status: { $ref: "#/components/schemas/AccessGrantStatus", description: "Computed: ACTIVE with expires_at <= now is returned as EXPIRED" }
        revoked_at: { type: [string, "null"], format: date-time }
        revoked_by: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        revocation_reason: { type: [string, "null"] }
    DownloadSessionCreate:
      type: object
      additionalProperties: false
      properties:
        project_id: { $ref: "#/components/schemas/Id", description: "Required when basis would be GRANT (CONTROLLED/SENSITIVE for non-owner org)" }
        file_ids: { type: array, items: { $ref: "#/components/schemas/Id" }, minItems: 1, maxItems: 500, description: "Default: all files of the version" }
    DownloadSession:
      type: object
      required: [dataset_version_id, basis, expires_at, files]
      properties:
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        basis: { type: string, enum: [PUBLIC, OWNER_ORGANIZATION, GRANT] }
        access_grant_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        expires_at: { $ref: "#/components/schemas/Timestamp", description: "URL expiry (now + 300s)" }
        files:
          type: array
          items:
            type: object
            required: [file_id, path, url, size_bytes, sha256]
            properties:
              file_id: { $ref: "#/components/schemas/Id" }
              path: { type: string }
              url: { type: string, format: uri }
              size_bytes: { type: integer }
              sha256: { type: string }

    # ---------- readiness
    ReadinessProfile:
      type: object
      required: [profile_id, version, name, checks]
      properties:
        profile_id: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [check_id, severity]
            properties:
              check_id: { type: string }
              severity: { type: string, enum: [REQUIRED, RECOMMENDED], description: "REQUIRED FAIL => overall FAIL; RECOMMENDED FAIL => overall WARNING" }
    ReadinessCheckResult:
      type: object
      required: [check_id, status, severity, message, evidence]
      properties:
        check_id: { type: string }
        status: { $ref: "#/components/schemas/ReadinessCheckStatus" }
        severity: { type: string, enum: [REQUIRED, RECOMMENDED] }
        message: { type: string }
        evidence: { type: object, additionalProperties: true, description: "Statistics/locations only, never raw values (D-018)" }
    ReadinessValidation:
      type: object
      required: [validation_id, dataset_version_id, profile_id, profile_version, run_status, created_at]
      properties:
        validation_id: { $ref: "#/components/schemas/Id" }
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        profile_id: { type: string }
        profile_version: { type: string }
        run_status: { $ref: "#/components/schemas/ReadinessRunStatus" }
        overall_status: { oneOf: [ { $ref: "#/components/schemas/ReadinessOverall" }, { type: "null" } ] }
        summary:
          type: object
          properties:
            pass: { type: integer }
            warning: { type: integer }
            fail: { type: integer }
            not_applicable: { type: integer }
        checks: { type: array, items: { $ref: "#/components/schemas/ReadinessCheckResult" } }
        validator_version: { type: string }
        input_fingerprint: { type: string, description: "sha256(manifest_sha256 + metadata_snapshot_sha256 + profile_id + profile_version + validator_version)" }
        error: { type: [string, "null"], description: "Set when run_status=FAILED" }
        triggered_by: { type: string, enum: [AUTO_ON_PUBLISH, USER] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    # ---------- audit / notification
    AuditEvent:
      type: object
      required: [audit_event_id, occurred_at, action, result, actor, resource, source_event_id, trace_id]
      properties:
        audit_event_id: { $ref: "#/components/schemas/Id" }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        action: { $ref: "#/components/schemas/AuditAction" }
        result: { type: string, enum: [SUCCESS, DENIED] }
        reason: { type: [string, "null"] }
        actor:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [USER, SYSTEM] }
            user_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
            display_name: { type: [string, "null"] }
            organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        resource:
          type: object
          required: [type, id]
          properties:
            type: { $ref: "#/components/schemas/ResourceType" }
            id: { $ref: "#/components/schemas/Id" }
            owner_organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        project_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        policy_version: { type: [string, "null"] }
        source_event_id: { $ref: "#/components/schemas/Id" }
        source_event_type: { type: string }
        trace_id: { type: string, description: "= source event correlation_id" }
        details: { type: object, additionalProperties: true }
    Notification:
      type: object
      required: [notification_id, type, title, created_at, read]
      properties:
        notification_id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: "Web route, e.g. /commons/access/{id}" }
        read: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    # ---------- hub (1.6.0)
    DatasetActivityType: { type: string, enum: [VERSION_PUBLISHED, METADATA_CHANGED, POLICY_CHANGED, READINESS_COMPLETED, USED_IN_PROJECT, OUTPUT_PUBLISHED, DISCUSSION_STARTED] }
    HubCard:
      type: object
      required: [dataset_id, title, owner_organization_name, subject_labels, access_level, readiness_overall, updated_at, metric]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        owner_organization_name: { type: string }
        subject_labels: { type: array, items: { type: string }, description: "Korean SUBJECT vocabulary labels" }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        readiness_overall: { oneOf: [ { $ref: "#/components/schemas/ReadinessOverall" }, { type: "null" } ], description: "Same rule as DatasetVersionSummary.readiness_overall (D-028)" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        metric: { type: [integer, "null"], minimum: 0, description: "trending = access requests in the last 7 days, most_used = project inputs, recent = null. Only real counts; null hides the figure." }
    HubOrganizationStat:
      type: object
      required: [organization_id, name, dataset_count, public_count, controlled_count, last_updated_at]
      properties:
        organization_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        dataset_count: { type: integer, minimum: 0 }
        public_count: { type: integer, minimum: 0 }
        controlled_count: { type: integer, minimum: 0, description: "CONTROLLED + SENSITIVE" }
        last_updated_at: { type: [string, "null"], format: date-time }
    HubOverview:
      type: object
      required: [rails, organizations]
      properties:
        rails:
          type: object
          required: [trending, recent, most_used]
          properties:
            trending: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/HubCard" } }
            recent: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/HubCard" } }
            most_used: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/HubCard" } }
        organizations: { type: array, items: { $ref: "#/components/schemas/HubOrganizationStat" } }
    DatasetProjectUse:
      type: object
      required: [project_id, name, lead_organization_name, input_added_at]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        lead_organization_name: { type: string }
        input_added_at: { $ref: "#/components/schemas/Timestamp" }
    DatasetProjectsResult:
      type: object
      required: [items, hidden_count]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DatasetProjectUse" } }
        hidden_count: { type: integer, minimum: 0, description: "Projects using the dataset that the caller is not a member of (names hidden)" }
    DatasetActivity:
      type: object
      required: [activity_id, dataset_id, type, label, ref_id, actor_display_name, project_id, occurred_at]
      properties:
        activity_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/DatasetActivityType" }
        label: { type: [string, "null"], description: "Entity label (version label, project name, output title, thread title); never data values" }
        ref_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "Version, project, output or thread id for linking" }
        actor_display_name: { type: [string, "null"] }
        project_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "Set only when the caller is a member of that project" }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }

    # ---------- workspace (1.6.0)
    RunStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
    OutputKind: { type: string, enum: [DERIVED_DATASET, FILE] }
    OutputPublishStatus: { type: string, enum: [NONE, PENDING, APPROVED, REJECTED, PUBLISHED] }
    PublishRequestStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    PublishDecision: { type: string, enum: [APPROVE, REJECT] }
    ThreadScope: { type: string, enum: [PROJECT, DATASET, OUTPUT, RECIPE] }
    RecipeStepType:
      type: string
      enum: [select_columns, filter_rows, drop_missing, fill_missing, cast_type, convert_unit, aggregate, join, sort, limit]
      description: "Discriminator values of RecipeStep.type"
    RecipeFilterOp: { type: string, enum: [eq, ne, lt, le, gt, ge, contains, in, is_null, not_null] }
    RecipeCastType: { type: string, enum: [int, float, string, bool, datetime] }
    RecipeAggregateFn: { type: string, enum: [count, sum, mean, min, max] }
    RecipeJoinHow: { type: string, enum: [inner, left] }
    ProjectInput:
      type: object
      required: [input_id, project_id, dataset_id, dataset_title, dataset_version_id, version_label, newer_version_label, access_level, access_lapsed, added_by, added_by_display_name, added_at, note]
      properties:
        input_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_title: { type: string }
        dataset_version_id: { $ref: "#/components/schemas/Id", description: "Pinned version" }
        version_label: { type: string }
        newer_version_label: { type: [string, "null"], description: "Latest PUBLISHED label when newer than the pinned version" }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        access_lapsed: { type: boolean, description: "true when the caller's access was revoked or expired; runs and downloads using it are blocked (INPUT_ACCESS_LAPSED)" }
        added_by: { $ref: "#/components/schemas/Id" }
        added_by_display_name: { type: string }
        added_at: { $ref: "#/components/schemas/Timestamp" }
        note: { type: [string, "null"] }
    ProjectInputCreate:
      type: object
      additionalProperties: false
      required: [dataset_id]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_version_id: { $ref: "#/components/schemas/Id", description: "Default: latest PUBLISHED version" }
        note: { type: string, maxLength: 2000 }
    ProjectInputUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        note: { type: [string, "null"], maxLength: 2000 }
    RecipeStepSelectColumns:
      type: object
      additionalProperties: false
      required: [type, columns]
      properties:
        type: { const: select_columns }
        columns: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    RecipeStepFilterRows:
      type: object
      additionalProperties: false
      required: [type, column, op]
      properties:
        type: { const: filter_rows }
        column: { type: string, minLength: 1 }
        op: { $ref: "#/components/schemas/RecipeFilterOp" }
        value:
          description: "Required except for is_null/not_null; an array for in"
          anyOf:
            - { type: string }
            - { type: integer }
            - { type: number }
            - { type: boolean }
            - { type: "null" }
            - { type: array, maxItems: 1000, items: { anyOf: [ { type: string }, { type: integer }, { type: number } ] } }
    RecipeStepDropMissing:
      type: object
      additionalProperties: false
      required: [type, columns]
      properties:
        type: { const: drop_missing }
        columns: { type: [array, "null"], items: { type: string, minLength: 1 }, description: "null = any column" }
    RecipeStepFillMissing:
      type: object
      additionalProperties: false
      required: [type, column, value]
      properties:
        type: { const: fill_missing }
        column: { type: string, minLength: 1 }
        value: { anyOf: [ { type: string }, { type: integer }, { type: number }, { type: boolean } ] }
    RecipeStepCastType:
      type: object
      additionalProperties: false
      required: [type, column, to]
      properties:
        type: { const: cast_type }
        column: { type: string, minLength: 1 }
        to: { $ref: "#/components/schemas/RecipeCastType" }
    RecipeStepConvertUnit:
      type: object
      additionalProperties: false
      required: [type, column, factor, offset, unit_label]
      properties:
        type: { const: convert_unit }
        column: { type: string, minLength: 1 }
        factor: { type: number, description: "new = old * factor + offset" }
        offset: { type: number }
        unit_label: { type: string, minLength: 1, maxLength: 32 }
    RecipeStepAggregate:
      type: object
      additionalProperties: false
      required: [type, group_by, metrics]
      properties:
        type: { const: aggregate }
        group_by: { type: array, items: { type: string, minLength: 1 } }
        metrics:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [column, fn]
            properties:
              column: { type: string, minLength: 1 }
              fn: { $ref: "#/components/schemas/RecipeAggregateFn" }
    RecipeStepJoin:
      type: object
      additionalProperties: false
      required: [type, right_input_id, "on", how]
      properties:
        type: { const: join }
        right_input_id: { $ref: "#/components/schemas/Id", description: "Must be one of the recipe's input_ids" }
        "on": { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        how: { $ref: "#/components/schemas/RecipeJoinHow" }
    RecipeStepSort:
      type: object
      additionalProperties: false
      required: [type, by, descending]
      properties:
        type: { const: sort }
        by: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        descending: { type: boolean }
    RecipeStepLimit:
      type: object
      additionalProperties: false
      required: [type, n]
      properties:
        type: { const: limit }
        n: { type: integer, minimum: 1, maximum: 5000000 }
    RecipeStep:
      oneOf:
        - $ref: "#/components/schemas/RecipeStepSelectColumns"
        - $ref: "#/components/schemas/RecipeStepFilterRows"
        - $ref: "#/components/schemas/RecipeStepDropMissing"
        - $ref: "#/components/schemas/RecipeStepFillMissing"
        - $ref: "#/components/schemas/RecipeStepCastType"
        - $ref: "#/components/schemas/RecipeStepConvertUnit"
        - $ref: "#/components/schemas/RecipeStepAggregate"
        - $ref: "#/components/schemas/RecipeStepJoin"
        - $ref: "#/components/schemas/RecipeStepSort"
        - $ref: "#/components/schemas/RecipeStepLimit"
      discriminator:
        propertyName: type
        mapping:
          select_columns: "#/components/schemas/RecipeStepSelectColumns"
          filter_rows: "#/components/schemas/RecipeStepFilterRows"
          drop_missing: "#/components/schemas/RecipeStepDropMissing"
          fill_missing: "#/components/schemas/RecipeStepFillMissing"
          cast_type: "#/components/schemas/RecipeStepCastType"
          convert_unit: "#/components/schemas/RecipeStepConvertUnit"
          aggregate: "#/components/schemas/RecipeStepAggregate"
          join: "#/components/schemas/RecipeStepJoin"
          sort: "#/components/schemas/RecipeStepSort"
          limit: "#/components/schemas/RecipeStepLimit"
    Recipe:
      type: object
      required: [recipe_id, project_id, name, input_ids, steps, version, updated_by, updated_at]
      properties:
        recipe_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        input_ids: { type: array, items: { $ref: "#/components/schemas/Id" }, description: "First id is the base table; join steps reference the others" }
        steps: { type: array, items: { $ref: "#/components/schemas/RecipeStep" } }
        version: { type: integer, minimum: 1, description: "+1 on every save; send as If-Match on updateRecipe" }
        updated_by: { $ref: "#/components/schemas/Id" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    RecipeWrite:
      type: object
      additionalProperties: false
      required: [name, input_ids, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        input_ids: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { $ref: "#/components/schemas/Id" } }
        steps: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RecipeStep" } }
    RecipePreviewRequest:
      type: object
      additionalProperties: false
      properties:
        input_ids: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { $ref: "#/components/schemas/Id" } }
        steps: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RecipeStep" } }
    RecipePreview:
      type: object
      required: [header, rows, rows_truncated, input_rows_read, output_rows]
      properties:
        header: { type: array, items: { type: string } }
        rows: { type: array, maxItems: 100, items: { type: array, items: { type: [string, "null"], maxLength: 200 } } }
        rows_truncated: { type: boolean, description: "More than 100 result rows" }
        input_rows_read: { type: integer, minimum: 0, description: "Rows read from the inputs (≤ 10,000 per input)" }
        output_rows: { type: integer, minimum: 0, description: "Result rows of the sampled inputs" }
    Run:
      type: object
      required: [run_id, project_id, recipe_id, recipe_version, status, started_by, queued_at, started_at, finished_at, input_rows, output_rows, error, output_id]
      properties:
        run_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        recipe_id: { $ref: "#/components/schemas/Id" }
        recipe_version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/RunStatus" }
        started_by: { $ref: "#/components/schemas/Id" }
        queued_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        input_rows: { type: [integer, "null"], minimum: 0 }
        output_rows: { type: [integer, "null"], minimum: 0 }
        error: { type: [string, "null"], description: "Short summary when FAILED (no stack trace, no data values)" }
        output_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "DERIVED_DATASET output when SUCCEEDED" }
    OutputFile:
      type: object
      required: [name, size_bytes, sha256, media_type]
      properties:
        name: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        media_type: { type: string }
    OutputLineageInput:
      type: object
      required: [dataset_id, dataset_title, dataset_version_id, version_label]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_title: { type: string }
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        version_label: { type: string }
    OutputLineage:
      type: object
      required: [inputs, recipe_id, recipe_version, run_id]
      properties:
        inputs: { type: array, items: { $ref: "#/components/schemas/OutputLineageInput" } }
        recipe_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        recipe_version: { type: [integer, "null"], minimum: 1 }
        run_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
    Output:
      type: object
      required: [output_id, project_id, kind, title, access_level, files, produced_by_run_id, lineage, publish_status, created_by, created_at]
      properties:
        output_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/OutputKind" }
        title: { type: string }
        access_level: { $ref: "#/components/schemas/AccessLevel", description: "Never looser than the strictest lineage input" }
        files: { type: array, items: { $ref: "#/components/schemas/OutputFile" } }
        produced_by_run_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "null for uploaded FILE outputs" }
        lineage: { $ref: "#/components/schemas/OutputLineage" }
        publish_status: { $ref: "#/components/schemas/OutputPublishStatus" }
        created_by: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    OutputUploadCreate:
      type: object
      additionalProperties: false
      required: [title, access_level, files]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        files:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [name, size_bytes, sha256, media_type]
            properties:
              name: { type: string, pattern: "^[A-Za-z0-9._-]{1,255}$", description: "Flat file name, no path" }
              size_bytes: { type: integer, minimum: 1, maximum: 5368709120, description: "Single presigned PUT: ≤ 5 GiB" }
              sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
              media_type: { type: string }
    OutputUploadSession:
      type: object
      required: [output_id, expires_at, files]
      properties:
        output_id: { $ref: "#/components/schemas/Id" }
        expires_at: { $ref: "#/components/schemas/Timestamp", description: "now + 15 min" }
        files:
          type: array
          items:
            type: object
            required: [name, upload]
            properties:
              name: { type: string }
              upload:
                type: object
                required: [method, url]
                properties:
                  method: { const: PUT }
                  url: { type: string, format: uri }
                  headers: { type: object, additionalProperties: { type: string } }
    OutputDownload:
      type: object
      required: [output_id, expires_at, files]
      properties:
        output_id: { $ref: "#/components/schemas/Id" }
        expires_at: { $ref: "#/components/schemas/Timestamp", description: "URL expiry (now + 300s)" }
        files:
          type: array
          items:
            type: object
            required: [name, url, size_bytes, sha256]
            properties:
              name: { type: string }
              url: { type: string, format: uri }
              size_bytes: { type: integer }
              sha256: { type: string }
    PublishApproval:
      type: object
      required: [organization_id, decided_by, decision, comment, decided_at]
      properties:
        organization_id: { $ref: "#/components/schemas/Id" }
        organization_name: { type: string }
        decided_by: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        decision: { oneOf: [ { $ref: "#/components/schemas/PublishDecision" }, { type: "null" } ] }
        comment: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
    PublishRequest:
      type: object
      required: [request_id, output_id, project_id, status, approvals, created_by, created_at]
      properties:
        request_id: { $ref: "#/components/schemas/Id" }
        output_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/PublishRequestStatus" }
        approvals: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PublishApproval" }, description: "One slot per owner organization of the lineage inputs, then the project lead organization when it owns none of them (only the lead organization for an output without inputs); each decided by a DATA_STEWARD of that organization" }
        created_by: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        output_title: { type: string }
        project_name: { type: string }
        published_dataset_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "Catalog dataset created once APPROVED" }
        failure_reason: { type: [string, "null"], description: "Set when an APPROVED request could not be published by the catalog and was turned REJECTED by the system (human-readable, no data values)" }
    PublishRequestCreate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 3, maxLength: 300, description: "Dataset title; default = output title" }
        description: { type: string, maxLength: 20000 }
    PublishDecisionCreate:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/PublishDecision" }
        comment: { type: string, maxLength: 2000, description: "Required (minLength 1) for REJECT; enforced by the server" }
    Thread:
      type: object
      required: [thread_id, scope, target_id, project_id, title, created_by, created_by_display_name, created_at, resolved, comment_count, last_comment_at]
      properties:
        thread_id: { $ref: "#/components/schemas/Id" }
        scope: { $ref: "#/components/schemas/ThreadScope" }
        target_id: { $ref: "#/components/schemas/Id", description: "project_id, dataset_id, output_id or recipe_id per scope" }
        project_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "null for DATASET threads" }
        title: { type: string }
        created_by: { $ref: "#/components/schemas/Id" }
        created_by_display_name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        resolved: { type: boolean }
        comment_count: { type: integer, minimum: 1 }
        last_comment_at: { $ref: "#/components/schemas/Timestamp" }
    ThreadCreate:
      type: object
      additionalProperties: false
      required: [scope, target_id, title, body]
      properties:
        scope: { $ref: "#/components/schemas/ThreadScope" }
        target_id: { $ref: "#/components/schemas/Id" }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000, description: "Markdown" }
    ThreadUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        resolved: { type: boolean }
        title: { type: string, minLength: 1, maxLength: 200 }
    Comment:
      type: object
      required: [comment_id, thread_id, body, author_id, author_display_name, created_at, edited_at]
      properties:
        comment_id: { $ref: "#/components/schemas/Id" }
        thread_id: { $ref: "#/components/schemas/Id" }
        body: { type: string, description: "Markdown" }
        author_id: { $ref: "#/components/schemas/Id" }
        author_display_name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        edited_at: { type: [string, "null"], format: date-time }
    CommentCreate:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000, description: "Markdown" }

    # ---------- notes (1.6.0)
    NoteStatus: { type: string, enum: [DRAFT, SUBMITTED, SIGNED] }
    NoteDraftStatus: { type: string, enum: [NONE, QUEUED, RUNNING, FAILED, DONE] }
    NoteSection: { type: string, enum: [DIRECTION, STEPS, RESULTS, NEXT, MEMO] }
    NoteBlockOrigin: { type: string, enum: [HUMAN, AI] }
    NoteSignerRole: { type: string, enum: [RECORDER, WITNESS] }
    NoteEvidenceType:
      type: string
      enum: [INPUT_ADDED, INPUT_VERSION_CHANGED, RECIPE_SAVED, RUN_SUCCEEDED, RUN_FAILED, OUTPUT_CREATED, PUBLISH_REQUESTED, DATASET_DOWNLOADED, ACCESS_DECIDED]
    NoteEvidence:
      type: object
      required: [type, ref_id, label, at]
      properties:
        type: { $ref: "#/components/schemas/NoteEvidenceType" }
        ref_id: { $ref: "#/components/schemas/Id", description: "Input, recipe, run, output, publish request, dataset version or access request id" }
        label: { type: string, description: "Entity label only (dataset title@version, recipe name, row counts); never data values" }
        at: { $ref: "#/components/schemas/Timestamp" }
    NoteBlock:
      type: object
      required: [block_id, section, text, origin, accepted, evidence]
      properties:
        block_id: { $ref: "#/components/schemas/Id" }
        section: { $ref: "#/components/schemas/NoteSection" }
        text: { type: string }
        origin: { $ref: "#/components/schemas/NoteBlockOrigin" }
        accepted: { type: boolean, description: "AI blocks start false; submit/sign require every AI block accepted" }
        evidence: { type: array, items: { $ref: "#/components/schemas/NoteEvidence" } }
    NoteBlockWrite:
      type: object
      additionalProperties: false
      required: [section, text]
      properties:
        block_id: { $ref: "#/components/schemas/Id", description: "Existing block (keeps origin and evidence); omit for a new HUMAN block" }
        section: { $ref: "#/components/schemas/NoteSection" }
        text: { type: string, minLength: 1, maxLength: 4000 }
        accepted: { type: boolean, description: "Accepting an AI block; ignored for HUMAN blocks (always true)" }
    NoteBlocksPut:
      type: object
      additionalProperties: false
      required: [blocks]
      properties:
        blocks: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/NoteBlockWrite" } }
    NoteSignature:
      type: object
      required: [signer_id, signer_display_name, role, signed_at, content_hash]
      properties:
        signer_id: { $ref: "#/components/schemas/Id" }
        signer_display_name: { type: string }
        role: { $ref: "#/components/schemas/NoteSignerRole" }
        signed_at: { $ref: "#/components/schemas/Timestamp", description: "Server time" }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ResearchNote:
      type: object
      required: [note_id, project_id, project_name, organization_id, recorder_id, recorder_display_name, note_date, version, previous_version_id, status, revision, blocks,
                 draft_status, draft_error, signatures, witness_required, witness_user_ids, content_hash, chain_hash, submitted_at, rejected_reason,
                 created_at, updated_at]
      properties:
        note_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        project_name: { type: string }
        organization_id: { $ref: "#/components/schemas/Id", description: "Recorder's organization when the note was created; never changes (지침 제8·9조)" }
        recorder_id: { $ref: "#/components/schemas/Id" }
        recorder_display_name: { type: string }
        note_date: { type: string, format: date, description: "Asia/Seoul date" }
        version: { type: integer, minimum: 1 }
        previous_version_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        status: { $ref: "#/components/schemas/NoteStatus" }
        revision: { type: integer, minimum: 1, description: "+1 on every block save; send as If-Match on updateNoteBlocks" }
        blocks: { type: array, items: { $ref: "#/components/schemas/NoteBlock" } }
        draft_status: { $ref: "#/components/schemas/NoteDraftStatus" }
        draft_error: { type: [string, "null"] }
        signatures: { type: array, items: { $ref: "#/components/schemas/NoteSignature" } }
        content_hash: { type: [string, "null"], pattern: "^[a-f0-9]{64}$", description: "sha256 of the canonical JSON of content + metadata; set on submit/sign, cleared when a witness rejects the note back to DRAFT" }
        chain_hash: { type: [string, "null"], pattern: "^[a-f0-9]{64}$", description: "sha256(previous chain_hash + content_hash) per project × organization; set when SIGNED" }
        submitted_at: { type: [string, "null"], format: date-time }
        rejected_reason: { type: [string, "null"] }
        witness_required: { type: boolean, readOnly: true, description: "Snapshot of the project setting taken at submit (or at a sign from DRAFT). signNote/rejectNote use this, never the current setting. While DRAFT it mirrors the current setting for display and is re-taken at the next submit." }
        witness_user_ids: { type: array, readOnly: true, uniqueItems: true, items: { $ref: "#/components/schemas/Id" }, description: "Witness snapshot taken together with witness_required; these users may read, reject and sign the SUBMITTED/SIGNED note" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ResearchNoteSummary:
      type: object
      required: [note_id, project_id, project_name, recorder_id, recorder_display_name, note_date, version, status, draft_status, block_count, updated_at]
      properties:
        note_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        project_name: { type: string }
        recorder_id: { $ref: "#/components/schemas/Id" }
        recorder_display_name: { type: string }
        note_date: { type: string, format: date }
        version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/NoteStatus" }
        draft_status: { $ref: "#/components/schemas/NoteDraftStatus" }
        block_count: { type: integer, minimum: 0 }
        unaccepted_ai_count: { type: integer, minimum: 0 }
        submitted_at: { type: [string, "null"], format: date-time }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    NoteVerification:
      type: object
      required: [note_id, valid, content_hash, recomputed_hash, chain_valid, checked_at]
      properties:
        note_id: { $ref: "#/components/schemas/Id" }
        valid: { type: boolean, description: "content_hash == recomputed_hash" }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        recomputed_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        chain_valid: { type: boolean, description: "Rebuilt project × organization chain matches the stored chain_hash values" }
        checked_at: { $ref: "#/components/schemas/Timestamp" }
    NoteSearchHit:
      type: object
      required: [note_id, project_name, note_date, snippet, score]
      properties:
        note_id: { $ref: "#/components/schemas/Id" }
        project_name: { type: string }
        note_date: { type: string, format: date }
        snippet: { type: string }
        score: { type: [number, "null"], description: "Rerank/cosine score; null for keyword fallback" }
    NoteSettings:
      type: object
      required: [project_id, witness_required, witness_user_ids, llm_enabled]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        witness_required: { type: boolean, default: false }
        witness_user_ids: { type: array, items: { $ref: "#/components/schemas/Id" }, uniqueItems: true }
        llm_enabled: { type: boolean, readOnly: true, description: "Server setting NAIS_LLM_ENABLED; hides the draft button when false" }
    NoteSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        witness_required: { type: boolean }
        witness_user_ids: { type: array, maxItems: 20, uniqueItems: true, items: { $ref: "#/components/schemas/Id" } }
