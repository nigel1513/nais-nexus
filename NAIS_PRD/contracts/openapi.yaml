openapi: 3.1.0
info:
  title: NAIS AI-OS / Research Commons API
  version: 1.6.0
  description: |
    P0 contract. Owner: Agent 0 (Platform). Changes only via CONTRACT_CHANGE_REQUEST.md.

    Conventions
    - Base path `/api/v1`, served behind gateway `http://localhost:21051`.
    - IDs are opaque UUID (v7 recommended). Times are UTC ISO 8601.
    - Errors use `ErrorEnvelope`; codes are listed in `contracts/error_codes.json`.
    - List endpoints use cursor pagination (`cursor`, `limit` default 20, max 100).
    - Every response carries `X-Request-Id`; `error.trace_id` equals the OpenTelemetry trace id.
    - "Not visible" resources return 404 (not 403) to avoid existence leaks, except where noted.
servers:
  - url: http://localhost:21051/api/v1
security:
  - bearerAuth: []
tags:
  - name: health
  - name: identity
  - name: projects
  - name: catalog
  - name: governance
  - name: readiness
  - name: audit
  - name: notifications
  - name: hub
  - name: workspace
  - name: notes

paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      security: []
      responses:
        "200": { description: Process alive, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      security: []
      responses:
        "200": { description: All dependencies reachable, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: A dependency is down, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }

  # ---------------------------------------------------------------- identity (M01)
  /me:
    get:
      tags: [identity]
      operationId: getMe
      description: Returns the caller. First call of a session provisions the user (JIT) and emits identity.user.logged_in.v1.
      responses:
        "200": { description: Caller profile, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "JIT provisioning email conflict (CONFLICT)" }
    patch:
      tags: [identity]
      operationId: updateMe
      description: Self-service profile fields. `national_researcher_number` is the NTIS 국가연구자번호 (8 digits); null clears it. Emits identity.user.updated.v1.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MeUpdate" } } }
      responses:
        "200": { description: Updated caller, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "NTIS number already registered by another user (CONFLICT)" }
        "422": { $ref: "#/components/responses/Error" }
  /users:
    get:
      tags: [identity]
      operationId: listUsers
      description: Directory search for inviting members. Returns only ACTIVE users with an ACTIVE membership.
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2 }, description: Matches display_name or email prefix }
        - { name: organization_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/IdentityPublicProfile" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /users/{user_id}/transfer:
    parameters: [ { $ref: "#/components/parameters/UserId" } ]
    post:
      tags: [identity]
      operationId: transferUserOrganization
      description: PLATFORM_ADMIN only. Ends the user's current membership (kept as history) and starts one in organization_id; updates the Keycloak org_code attribute. Emits identity.membership.changed.v1 for both memberships. Same target org = idempotent 200.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserTransfer" } } }
      responses:
        "200": { description: New current membership, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationMembership" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error", description: "Keycloak admin API unavailable (DEPENDENCY_UNAVAILABLE); nothing changed" }
  /organizations:
    get:
      tags: [identity]
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/OrganizationSummary" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}:
    parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
    get:
      tags: [identity]
      operationId: getOrganization
      responses:
        "200": { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/members:
    parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
    get:
      tags: [identity]
      operationId: listOrganizationMembers
      description: ORG_ADMIN of the organization or PLATFORM_ADMIN only.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/OrganizationMembership" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [identity]
      operationId: updateOrganizationMember
      description: ORG_ADMIN / PLATFORM_ADMIN. Emits identity.membership.changed.v1. Disabling a membership triggers grant revocation (MEMBERSHIP_DISABLED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" }, uniqueItems: true }
                status: { $ref: "#/components/schemas/ActiveStatus" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationMembership" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- projects (M02)
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      description: Projects the caller is a member of, plus PUBLIC projects when `scope=discover`.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, discover], default: mine } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProjectStatus" } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectSummary" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: createProject
      description: Caller becomes PROJECT_OWNER; caller's organization becomes lead organization.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [projects]
      operationId: getProject
      description: Members only. Non-members get 404 for PRIVATE and 403 FORBIDDEN for PUBLIC.
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: updateProject
      description: PROJECT_OWNER / PROJECT_ADMIN.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/archive:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    post:
      tags: [projects]
      operationId: archiveProject
      description: PROJECT_OWNER only. Emits project.archived.v1; governance revokes all project-scoped grants.
      responses:
        "200": { description: Archived, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/members:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [projects]
      operationId: listProjectMembers
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: addProjectMember
      description: PROJECT_OWNER / PROJECT_ADMIN. Cross-organization users allowed. P0 adds directly (ACTIVE) and notifies (D-007).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, role]
              properties:
                user_id: { $ref: "#/components/schemas/Id" }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [projects]
      operationId: updateProjectMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: removeProjectMember
      description: PROJECT_OWNER / PROJECT_ADMIN, or the member themself (leave). Emits project.member.removed.v1.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- catalog (M03)
  /datasets:
    get:
      tags: [catalog]
      operationId: searchDatasets
      description: OpenSearch-backed metadata search. Visibility per D-012. Search p95 < 1.5s.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: access_level, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AccessLevel" } } }
        - { name: owner_organization_id, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/Id" } } }
        - { name: purpose, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/Purpose" } } }
        - { name: keyword, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: readiness_status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/ReadinessOverall" } } }
        - { name: subject, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: SUBJECT vocabulary codes (any of) }
        - { name: material, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: method, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: collecting_organization_id, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/Id" } } }
        - { name: principal_investigator_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: temporal_from, in: query, schema: { type: string, format: date }, description: "Data period overlap: dataset temporal_end >= temporal_from (missing end = open-ended)" }
        - { name: temporal_to, in: query, schema: { type: string, format: date }, description: "Data period overlap: dataset temporal_start <= temporal_to" }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, updated_desc, title_asc], default: relevance } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Results, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetSearchResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [catalog]
      operationId: createDataset
      description: DATA_STEWARD of owner_organization_id only (D-013).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: getDataset
      responses:
        "200": { description: Dataset, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [catalog]
      operationId: updateDataset
      description: Owner-org DATA_STEWARD. Policy/access_level changes emit POLICY_CHANGED events. Existing grants are not altered by policy changes.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/policy:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: getDatasetPolicy
      description: Read model consumed by governance and web.
      responses:
        "200": { description: Policy view, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetPolicyView" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/contributors:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: listDatasetContributors
      description: Visible datasets only (D-012). Each contributor carries the affiliation at the time they were added.
      responses:
        "200": { description: Contributors, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DatasetContributor" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [catalog]
      operationId: putDatasetContributors
      description: Owner-org DATA_STEWARD. Replaces the whole list; unchanged (user_id, role) pairs keep their stored affiliation. Emits catalog.dataset.metadata_changed.v1 when the list changes.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetContributorsPut" } } }
      responses:
        "200": { description: Contributors, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DatasetContributor" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/metadata.jsonld:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: getDatasetJsonLd
      description: Machine-readable metadata (schema.org Dataset + DCAT + PROV context) for M11 / AI use. Visibility per D-012. Emails only when contact_email_public.
      responses:
        "200":
          description: JSON-LD document
          content:
            application/ld+json: { schema: { $ref: "#/components/schemas/DatasetJsonLd" } }
            application/json: { schema: { $ref: "#/components/schemas/DatasetJsonLd" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /vocabulary/{scheme}:
    parameters:
      - { name: scheme, in: path, required: true, schema: { $ref: "#/components/schemas/VocabularyScheme" } }
    get:
      tags: [catalog]
      operationId: listVocabulary
      description: All active terms of a controlled vocabulary (no pagination), ordered by parent_code then code.
      responses:
        "200": { description: Terms, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/VocabularyTerm" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [catalog]
      operationId: createVocabularyTerm
      description: PLATFORM_ADMIN only. Adds a term (code unique within the scheme).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VocabularyTermCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/VocabularyTerm" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/versions:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: listDatasetVersions
      description: Non-stewards see only PUBLISHED versions.
      responses:
        "200": { description: Versions, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DatasetVersion" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [catalog]
      operationId: createDatasetVersion
      description: Owner-org DATA_STEWARD. Creates a DRAFT version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version_label]
              properties:
                version_label: { type: string, pattern: "^[A-Za-z0-9._-]{1,32}$", examples: ["v1", "2026.09"] }
                change_note: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    get:
      tags: [catalog]
      operationId: getDatasetVersion
      description: Includes file manifest (names, sizes, checksums) - manifest is metadata, not data.
      responses:
        "200": { description: Version, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/upload-session:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [catalog]
      operationId: createUploadSession
      description: Owner-org DATA_STEWARD, DRAFT version only. Returns presigned PUT URLs (multipart above 64 MiB). Session TTL 1h.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadSessionCreate" } } }
      responses:
        "201": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /upload-sessions/{upload_session_id}:
    parameters:
      - { name: upload_session_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    get:
      tags: [catalog]
      operationId: getUploadSession
      description: Owner-org DATA_STEWARD. Poll file verification status. Presigned URLs are omitted after the session is COMPLETED/EXPIRED.
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/files/{file_id}:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
      - { name: file_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    delete:
      tags: [catalog]
      operationId: deleteDraftFile
      description: Owner-org DATA_STEWARD, DRAFT version only. Removes manifest row and stored object.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /upload-sessions/{upload_session_id}/complete:
    parameters:
      - { name: upload_session_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [catalog]
      operationId: completeUploadSession
      description: Completes multipart uploads and verifies size + sha256 (D-014). Files <= 256 MiB are verified synchronously (VERIFIED/FAILED in the response); larger files return UPLOADED and are verified asynchronously by the worker — poll getUploadSession. Files failing verification are marked FAILED with failure_code and deleted from storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parts:
                  type: array
                  description: Required for multipart files.
                  items:
                    type: object
                    required: [file_id, etags]
                    properties:
                      file_id: { $ref: "#/components/schemas/Id" }
                      etags: { type: array, items: { type: object, required: [part_number, etag], properties: { part_number: { type: integer, minimum: 1 }, etag: { type: string } } } }
      responses:
        "200": { description: Session result, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/publish:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [catalog]
      operationId: publishDatasetVersion
      description: Owner-org DATA_STEWARD. Requires >=1 file and all files VERIFIED. Version becomes immutable. Emits catalog.dataset.version_published.v1.
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dataset-files/{file_id}/profile:
    parameters: [ { name: file_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } } ]
    get:
      tags: [catalog]
      operationId: getFileProfile
      description: Data Explorer column summary of a tabular file (names, types, units, descriptions, concept IRIs, missing ratio, distinct count). Visible to everyone who can see the version; never contains raw values (D-018).
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/FileProfile" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dataset-files/{file_id}/preview:
    parameters: [ { name: file_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } } ]
    get:
      tags: [catalog]
      operationId: getFilePreview
      description: Data Explorer distributions (histograms, min/max/mean, top values) and the first 100 rows (cells ≤ 200 chars). Requires download permission (owner organization member, PUBLIC dataset, ACTIVE grant, PLATFORM_ADMIN); otherwise 403 with details.reason DOWNLOAD_PERMISSION_REQUIRED.
      responses:
        "200": { description: Preview, content: { application/json: { schema: { $ref: "#/components/schemas/FilePreview" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- governance (M04)
  /access-requests:
    get:
      tags: [governance]
      operationId: listAccessRequests
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [requester, reviewer], default: requester }, description: "requester = my requests; reviewer = requests for datasets owned by orgs where I am DATA_STEWARD" }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AccessRequestStatus" } } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: dataset_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [governance]
      operationId: createAccessRequest
      description: Creates in SUBMITTED (D-015). Caller must be an ACTIVE member of project_id with role other than VIEWER (VIEWER -> FORBIDDEN). Project must be ACTIVE.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestCreate" } } }
      responses:
        "201": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    get:
      tags: [governance]
      operationId: getAccessRequest
      description: Visible to requester and owner-org DATA_STEWARD/ORG_ADMIN. Read-only, no state change (D-025).
      responses:
        "200": { description: Request, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/start-review:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: startAccessReview
      description: Owner-org DATA_STEWARD (not the requester). SUBMITTED -> UNDER_REVIEW, emits governance.access.review_started.v1. Idempotent for UNDER_REVIEW. Optional — approve/reject/request-changes also accept SUBMITTED (D-025).
      responses:
        "200": { description: Under review, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/approve:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: approveAccessRequest
      description: Owner-org DATA_STEWARD. Allowed from SUBMITTED/UNDER_REVIEW. Creates ACTIVE grant.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessApprove" } } }
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/reject:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: rejectAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/request-changes:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: requestAccessChanges
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [comment], properties: { comment: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: Changes requested, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/resubmit:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: resubmitAccessRequest
      description: Requester only, from CHANGE_REQUESTED. Fields omitted keep previous values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                purpose: { $ref: "#/components/schemas/Purpose" }
                purpose_detail: { type: string, minLength: 20, maxLength: 4000 }
                operations: { type: array, items: { $ref: "#/components/schemas/Operation" }, minItems: 1, uniqueItems: true }
                requested_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200": { description: Resubmitted, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/withdraw:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: withdrawAccessRequest
      description: Requester only, from SUBMITTED/UNDER_REVIEW/CHANGE_REQUESTED.
      responses:
        "200": { description: Withdrawn, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-grants:
    get:
      tags: [governance]
      operationId: listAccessGrants
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [subject, owner], default: subject }, description: "subject = grants I hold; owner = grants on my org's datasets (DATA_STEWARD/ORG_ADMIN)" }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AccessGrantStatus" } } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: dataset_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AccessGrant" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-grants/{access_grant_id}/revoke:
    parameters:
      - { name: access_grant_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [governance]
      operationId: revokeAccessGrant
      description: Owner-org DATA_STEWARD / ORG_ADMIN. Effective immediately for new download sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrant" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/download-session:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [governance]
      operationId: createDownloadSession
      description: |
        Order (01_ARCHITECTURE §7): version PUBLISHED → basis (PUBLIC / OWNER_ORGANIZATION / GRANT) → for GRANT: active grant for (caller, project, dataset),
        operation READ, not expired, caller still ACTIVE project member → OPA decision → presigned GET URLs (TTL 300s).
        Every outcome is audited (authorized/denied).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DownloadSessionCreate" } } }
      responses:
        "201": { description: Signed URLs, content: { application/json: { schema: { $ref: "#/components/schemas/DownloadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- readiness (M05)
  /readiness-profiles:
    get:
      tags: [readiness]
      operationId: listReadinessProfiles
      responses:
        "200": { description: Profiles, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ReadinessProfile" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/readiness-validations:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [readiness]
      operationId: startReadinessValidation
      description: Owner-org DATA_STEWARD. PUBLISHED versions only. Same input fingerprint + profile version returns the existing COMPLETED result (200) instead of re-running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [profile_id], properties: { profile_id: { type: string, examples: ["GENERIC_BASIC", "TABULAR_ML_BASIC"] } } }
      responses:
        "200": { description: Existing identical result, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessValidation" } } } }
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessValidation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/readiness:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    get:
      tags: [readiness]
      operationId: getReadiness
      description: Latest validation per profile for this version. Visible to anyone who can see the dataset metadata. No results yet -> 200 with empty items; profile_id given but never run -> 404 READINESS_NOT_AVAILABLE.
      parameters:
        - { name: profile_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Latest results, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ReadinessValidation" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- audit & notifications (M09)
  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      description: |
        Scope: PLATFORM_ADMIN all; ORG_ADMIN/DATA_STEWARD events where actor org or resource owner org is theirs;
        other users: own actions, plus events of projects they are members of when project_id is given.
      parameters:
        - { name: action, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AuditAction" } } }
        - { name: actor_user_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: organization_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: resource_type, in: query, schema: { $ref: "#/components/schemas/ResourceType" } }
        - { name: resource_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit events (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Caller's notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                      unread_count: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notifications/{notification_id}/read:
    parameters:
      - { name: notification_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [notifications]
      operationId: markNotificationRead
      responses:
        "200": { description: Marked, content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      responses:
        "204": { description: All marked read }
        "401": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- hub (M13, contract 1.6.0)
  /hub/overview:
    get:
      tags: [hub]
      operationId: getHubOverview
      description: |
        Data-Hub home. Only datasets the caller can see (D-012). Each rail holds at most 6 cards:
        trending = most access requests in the last 7 days (0 excluded, metric = request count),
        recent = most recently published versions (metric null), most_used = most project inputs (metric = input count).
        Organization rows count ACTIVE datasets visible to the caller.
      responses:
        "200":
          description: Rails and organization table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HubOverview" }
              examples: { default: { $ref: "#/components/examples/HubOverview" } }
        "401": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/projects:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [hub]
      operationId: listDatasetProjects
      description: Projects that use this dataset as an input. Projects the caller is an ACTIVE member of are listed; the rest are only counted in hidden_count. Visible datasets only (else 404).
      responses:
        "200":
          description: Projects using the dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetProjectsResult" }
              examples: { default: { $ref: "#/components/examples/DatasetProjectsResult" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/activity:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [hub]
      operationId: listDatasetActivity
      description: Dataset history (versions, policy, validation, project use, hub publication, discussion), newest first. Visible datasets only (else 404).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Activity (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/DatasetActivity" } } } }
              examples: { default: { $ref: "#/components/examples/DatasetActivityPage" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- workspace (M13, contract 1.6.0)
  /projects/{project_id}/inputs:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [workspace]
      operationId: listProjectInputs
      description: ACTIVE project members only (else 404). access_lapsed is computed for the caller at read time.
      responses:
        "200":
          description: Pinned dataset inputs
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectInput" } } } }
              examples: { default: { $ref: "#/components/examples/ProjectInputList" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [workspace]
      operationId: addProjectInput
      description: |
        ACTIVE member other than VIEWER (FORBIDDEN). Dataset must be visible (404) and the version PUBLISHED (DATASET_VERSION_NOT_PUBLISHED).
        Non-PUBLIC datasets need an ACTIVE grant for the caller (403 ACCESS_REQUIRED, details.dataset_id for the access-request link).
        One live input per dataset (409 CONFLICT). Emits workspace.input.added.v1.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInputCreate" } } }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectInput" }
              examples: { default: { $ref: "#/components/examples/ProjectInput" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/inputs/{input_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InputId"
    patch:
      tags: [workspace]
      operationId: updateProjectInput
      description: ACTIVE member other than VIEWER. Changing dataset_version_id is an explicit, audited action (workspace.input.version_changed.v1) and re-checks access like addProjectInput.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInputUpdate" } } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectInput" }
              examples: { default: { $ref: "#/components/examples/ProjectInput" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workspace]
      operationId: removeProjectInput
      description: ACTIVE member other than VIEWER. Soft delete; recipes still referencing the input fail validation (RECIPE_INVALID) until edited. Emits workspace.input.removed.v1.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/recipes:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [workspace]
      operationId: listRecipes
      description: ACTIVE project members only (else 404).
      responses:
        "200":
          description: Recipes
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Recipe" } } } }
              examples: { default: { $ref: "#/components/examples/RecipeList" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [workspace]
      operationId: createRecipe
      description: ACTIVE member other than VIEWER. Steps are validated against the inputs' column profiles (422 RECIPE_INVALID with details.step_index). Creates version 1 and emits workspace.recipe.saved.v1.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipeWrite" } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
              examples: { default: { $ref: "#/components/examples/Recipe" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/recipes/{recipe_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RecipeId"
    get:
      tags: [workspace]
      operationId: getRecipe
      responses:
        "200":
          description: Recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
              examples: { default: { $ref: "#/components/examples/Recipe" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [workspace]
      operationId: updateRecipe
      description: ACTIVE member other than VIEWER. If-Match must carry the current version (409 CONFLICT otherwise). Saving increments version and emits workspace.recipe.saved.v1.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipeWrite" } } }
      responses:
        "200":
          description: Saved (new version)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
              examples: { default: { $ref: "#/components/examples/Recipe" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workspace]
      operationId: deleteRecipe
      description: ACTIVE member other than VIEWER. Not allowed while a run of the recipe is QUEUED/RUNNING (RUN_NOT_ALLOWED). Past runs and outputs keep their lineage.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/recipes/{recipe_id}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RecipeId"
    post:
      tags: [workspace]
      operationId: previewRecipe
      description: |
        Synchronous preview: reads at most the first 10,000 rows of each input, applies the steps and returns the first 100 rows (cells ≤ 200 chars).
        Body may carry unsaved input_ids/steps; omitted fields use the saved recipe. Lapsed inputs -> 409 INPUT_ACCESS_LAPSED; timeout (20 s) -> 503.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipePreviewRequest" } } }
      responses:
        "200":
          description: First rows of the result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipePreview" }
              examples: { default: { $ref: "#/components/examples/RecipePreview" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/recipes/{recipe_id}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RecipeId"
    post:
      tags: [workspace]
      operationId: startRun
      description: |
        ACTIVE member other than VIEWER. Pins the current recipe version and input versions. Every input must be accessible (409 INPUT_ACCESS_LAPSED);
        one QUEUED/RUNNING run per recipe (409 RUN_NOT_ALLOWED). Queued after commit; the worker emits workspace.run.succeeded.v1 / workspace.run.failed.v1.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
              examples: { default: { $ref: "#/components/examples/RunQueued" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/runs:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [workspace]
      operationId: listRuns
      description: ACTIVE project members only (else 404). Newest first.
      parameters:
        - { name: recipe_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/RunStatus" } } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Run" } } } }
              examples: { default: { $ref: "#/components/examples/RunPage" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [workspace]
      operationId: getRun
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
              examples: { default: { $ref: "#/components/examples/RunSucceeded" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/outputs:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [workspace]
      operationId: listOutputs
      description: ACTIVE project members only (else 404). Completed outputs only, newest first.
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/OutputKind" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Outputs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Output" } } } }
              examples: { default: { $ref: "#/components/examples/OutputPage" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [workspace]
      operationId: createOutputUpload
      description: |
        ACTIVE member other than VIEWER uploads files as a FILE output. Returns presigned PUT URLs (TTL 15 min, single PUT so ≤ 5 GiB per file).
        access_level may not be looser than the strictest project input (422 VALIDATION_FAILED, field access_level); default INTERNAL when the project has no inputs.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OutputUploadCreate" } } }
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputUploadSession" }
              examples: { default: { $ref: "#/components/examples/OutputUploadSession" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/outputs/{output_id}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OutputId"
    post:
      tags: [workspace]
      operationId: completeOutputUpload
      description: The uploader completes the session. Size and sha256 are re-checked server-side (422 UPLOAD_CHECKSUM_MISMATCH); expired session -> 409 UPLOAD_SESSION_EXPIRED. Emits workspace.output.created.v1.
      responses:
        "200":
          description: Output created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Output" }
              examples: { default: { $ref: "#/components/examples/OutputFile" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/outputs/{output_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OutputId"
    get:
      tags: [workspace]
      operationId: getOutput
      description: ACTIVE project members only (else 404). Includes lineage (inputs -> recipe@version -> run).
      responses:
        "200":
          description: Output with lineage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Output" }
              examples: { default: { $ref: "#/components/examples/OutputDerived" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/outputs/{output_id}/download:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OutputId"
    post:
      tags: [workspace]
      operationId: getOutputDownload
      description: ACTIVE project members only. Every lineage input must still be accessible (409 INPUT_ACCESS_LAPSED). Presigned GET URLs, TTL 300 s.
      responses:
        "201":
          description: Signed URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputDownload" }
              examples: { default: { $ref: "#/components/examples/OutputDownload" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/outputs/{output_id}/publish-requests:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OutputId"
    post:
      tags: [workspace]
      operationId: requestOutputPublish
      description: |
        ACTIVE member other than VIEWER asks to publish the output to the hub as a new dataset (owner = project lead organization).
        Allowed when publish_status is NONE or REJECTED (else 409 OUTPUT_PUBLISH_PENDING). One approval slot per owner organization of the lineage inputs,
        plus one for the project lead organization when it owns none of them (it becomes the dataset owner); an output without inputs needs only the
        lead organization. Every slot is decided by a DATA_STEWARD of its organization. Emits workspace.publish.requested.v1.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/PublishRequestCreate" } } }
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishRequest" }
              examples: { default: { $ref: "#/components/examples/PublishRequest" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /publish-requests:
    get:
      tags: [workspace]
      operationId: listPublishRequests
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [requester, reviewer], default: requester }, description: "requester = requests of projects I am a member of; reviewer = requests with an approval slot for an organization where I am DATA_STEWARD" }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/PublishRequestStatus" } } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Publish requests (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PublishRequest" } } } }
              examples: { default: { $ref: "#/components/examples/PublishRequestPage" } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /publish-requests/{request_id}/decision:
    parameters: [ { $ref: "#/components/parameters/PublishRequestId" } ]
    post:
      tags: [workspace]
      operationId: decidePublishRequest
      description: |
        DATA_STEWARD of an organization with a pending approval slot (403 otherwise); the requester never decides their own request (403).
        A REJECT needs a comment (422). Any REJECT -> REJECTED; all APPROVE -> APPROVED, then the catalog dataset is created (published by the lead
        organization's approving steward) and the output becomes PUBLISHED. If the catalog cannot publish it (terminal failure), the request becomes
        REJECTED with failure_reason and the output can be requested again. Decided slots cannot change (409). Emits workspace.publish.decided.v1.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PublishDecisionCreate" } } }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishRequest" }
              examples: { default: { $ref: "#/components/examples/PublishRequest" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /threads:
    get:
      tags: [workspace]
      operationId: listThreads
      description: |
        Either scope + target_id (one target) or project_id (all PROJECT/OUTPUT/RECIPE threads of the project) is required (422 otherwise).
        PROJECT/OUTPUT/RECIPE: ACTIVE project members only (404). DATASET: anyone who can see the dataset. Newest activity first.
      parameters:
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/ThreadScope" } }
        - { name: target_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: resolved, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Threads
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Thread" } } } }
              examples: { default: { $ref: "#/components/examples/ThreadPage" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [workspace]
      operationId: createThread
      description: Creates the thread with its first comment. PROJECT/OUTPUT/RECIPE need ACTIVE project membership; DATASET threads are open to every signed-in user who can see the dataset. Emits workspace.comment.added.v1.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThreadCreate" } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
              examples: { default: { $ref: "#/components/examples/Thread" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /threads/{thread_id}:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    patch:
      tags: [workspace]
      operationId: updateThread
      description: Thread author, or PROJECT_OWNER/PROJECT_ADMIN for project threads, or owner-org DATA_STEWARD for dataset threads.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThreadUpdate" } } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
              examples: { default: { $ref: "#/components/examples/Thread" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /threads/{thread_id}/comments:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    get:
      tags: [workspace]
      operationId: listComments
      description: Same read rule as the thread. Oldest first.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Comments (oldest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Comment" } } } }
              examples: { default: { $ref: "#/components/examples/CommentPage" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [workspace]
      operationId: addComment
      description: Same write rule as createThread. Markdown body, at most 10,000 characters. Emits workspace.comment.added.v1.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CommentCreate" } } }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
              examples: { default: { $ref: "#/components/examples/Comment" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- notes (M14, contract 1.6.0)
  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      description: |
        role=recorder (default): the caller's own notes (latest version per day). role=witness: SUBMITTED/SIGNED notes of projects
        where the caller is a configured witness. Newest note_date first. from/to are inclusive Asia/Seoul dates.
      parameters:
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/NoteStatus" } } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: role, in: query, schema: { type: string, enum: [recorder, witness], default: recorder } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ResearchNoteSummary" } } } }
              examples: { default: { $ref: "#/components/examples/ResearchNoteSummaryPage" } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notes/export:
    get:
      tags: [notes]
      operationId: exportNotes
      description: |
        ZIP of the caller's own notes in the project (every status). An ORG_ADMIN additionally gets the SUBMITTED/SIGNED notes of other
        recorders of their organization in the project — never other recorders' DRAFTs (DRAFT is recorder-only) — and each exported note
        of another recorder emits notes.note.viewed.v1 (열람 관리대장), as getNote does.
        Contents: notes/*.json, notes/*.html (human readable) and hashes.csv. Streamed. from/to are inclusive Asia/Seoul dates.
      parameters:
        - { name: project_id, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: ZIP archive
          headers:
            Content-Disposition: { schema: { type: string }, description: "attachment; filename=\"research-notes-<project>-<from>-<to>.zip\"" }
          content:
            application/zip: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notes/search:
    get:
      tags: [notes]
      operationId: searchNotes
      description: Semantic search (embedding + rerank, top 20) over notes the caller may read; falls back to keyword search with score null when the embedding service is off.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Hits (best first)
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/NoteSearchHit" } } } }
              examples: { default: { $ref: "#/components/examples/NoteSearchResult" } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/notes/today:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    post:
      tags: [notes]
      operationId: getOrCreateTodayNote
      description: ACTIVE project member. Returns the caller's latest note version for today (Asia/Seoul), or creates a DRAFT (organization_id = recorder's current organization, fixed for life).
      responses:
        "200":
          description: Existing note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteDraft" } }
        "201":
          description: Created DRAFT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteDraft" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/note-settings:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [notes]
      operationId: getNoteSettings
      description: ACTIVE project members. llm_enabled mirrors the server setting NAIS_LLM_ENABLED (read-only).
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteSettings" }
              examples: { default: { $ref: "#/components/examples/NoteSettings" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [notes]
      operationId: updateNoteSettings
      description: |
        PROJECT_OWNER / PROJECT_ADMIN. witness_user_ids must be ACTIVE project members (422). Applies only to notes submitted (or signed
        from DRAFT) afterwards: each note keeps the witness_required / witness_user_ids snapshot taken at its submit, and signNote, rejectNote
        and witness visibility use that snapshot, never the current setting.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteSettingsUpdate" } } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteSettings" }
              examples: { default: { $ref: "#/components/examples/NoteSettings" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notes/{note_id}:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    get:
      tags: [notes]
      operationId: getNote
      description: |
        Recorder always; SUBMITTED/SIGNED also the witnesses in the note's witness_user_ids snapshot who are ACTIVE members. Other ACTIVE members of the
        project get 403 FORBIDDEN; non-members, and anyone but the recorder for a DRAFT, get 404.
        A read by anyone other than the recorder emits notes.note.viewed.v1 (열람 관리대장).
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteSigned" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [notes]
      operationId: deleteNote
      description: |
        Recorder only, DRAFT only (409 NOTE_LOCKED for SUBMITTED/SIGNED; signed notes are never deleted). Deleting a revision DRAFT
        leaves the signed previous version untouched.
        Callers other than the recorder get the getNote answer: 404 when they cannot see the note (non-members, others' DRAFTs),
        403 FORBIDDEN otherwise (other ACTIVE project members, witnesses).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notes/{note_id}/blocks:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    put:
      tags: [notes]
      operationId: updateNoteBlocks
      description: |
        Recorder only, DRAFT only (409 NOTE_LOCKED). If-Match must carry the current revision (409 CONFLICT). Replaces the block list in order:
        listed block_ids keep their origin and evidence, new blocks (no block_id) are HUMAN/accepted, unlisted blocks are deleted.
        Callers other than the recorder get the getNote answer: 404 when they cannot see the note (non-members, others' DRAFTs),
        403 FORBIDDEN otherwise (other ACTIVE project members, witnesses).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteBlocksPut" } } }
      responses:
        "200":
          description: Saved (revision + 1)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteDraft" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notes/{note_id}/draft:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    post:
      tags: [notes]
      operationId: draftNote
      description: |
        Recorder only, DRAFT only (409 NOTE_LOCKED). Queues a local-LLM draft from the day's activity; new AI blocks are appended with accepted=false.
        Once per minute per note (429 RATE_LIMITED); 503 LLM_UNAVAILABLE when NAIS_LLM_ENABLED is false.
        Callers other than the recorder get the getNote answer: 404 when they cannot see the note (non-members, others' DRAFTs),
        403 FORBIDDEN otherwise (other ACTIVE project members, witnesses).
      responses:
        "202":
          description: Draft queued (draft_status QUEUED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteDraft" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /notes/{note_id}/submit:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    post:
      tags: [notes]
      operationId: submitNote
      description: |
        Recorder only, DRAFT -> SUBMITTED (locked). Unaccepted AI blocks -> 409 NOTE_HAS_UNACCEPTED_AI; other states -> 409 NOTE_LOCKED.
        Fixes content_hash and snapshots the project's witness_required / witness_user_ids onto the note (visible to those witnesses from now on).
        Emits notes.note.submitted.v1.
        Callers other than the recorder get the getNote answer: 404 when they cannot see the note (non-members, others' DRAFTs),
        403 FORBIDDEN otherwise (other ACTIVE project members, witnesses).
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteSubmitted" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notes/{note_id}/reject:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    post:
      tags: [notes]
      operationId: rejectNote
      description: A witness in the note's witness_user_ids snapshot only (403 NOTE_NOT_WITNESS), SUBMITTED -> DRAFT with a reason (409 otherwise); the next submit takes a new snapshot. Emits notes.note.rejected.v1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200":
          description: Returned to the recorder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteRejected" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notes/{note_id}/sign:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    post:
      tags: [notes]
      operationId: signNote
      description: |
        Requires a token whose auth_time is within 5 minutes (401 NOTE_SIGNATURE_EXPIRED -> re-authenticate).
        Recorder (RECORDER signature): from SUBMITTED in every case; from DRAFT only when the project currently requires no witness — that
        sign runs the submit checks (409 NOTE_HAS_UNACCEPTED_AI) and takes the witness snapshot (witness_required=false) in the same step.
        From DRAFT while the project requires witnesses -> 409 CONFLICT (submit first).
        Witness (WITNESS signature): a user in the note's witness_user_ids snapshot, SUBMITTED only, and only when the snapshot has
        witness_required=true; anyone else 403 NOTE_NOT_WITNESS.
        The note becomes SIGNED (chain_hash fixed) when it has the RECORDER signature and, if the snapshot requires witnesses, one WITNESS signature.
        Only the snapshot on the note is consulted, never the current project setting, so a SUBMITTED note can always be completed.
        Emits notes.note.signed.v1 per signature.
      responses:
        "200":
          description: Signature recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteSigned" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notes/{note_id}/revise:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    post:
      tags: [notes]
      operationId: reviseNote
      description: |
        Recorder only, SIGNED only (409 NOTE_LOCKED otherwise). Creates a new DRAFT version (version + 1, previous_version_id set, blocks copied);
        the signed version is unchanged.
        Callers other than the recorder get the getNote answer: 404 when they cannot see the note (non-members, others' DRAFTs),
        403 FORBIDDEN otherwise (other ACTIVE project members, witnesses).
      responses:
        "201":
          description: New DRAFT version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchNote" }
              examples: { default: { $ref: "#/components/examples/ResearchNoteDraft" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notes/{note_id}/verify:
    parameters: [ { $ref: "#/components/parameters/NoteId" } ]
    get:
      tags: [notes]
      operationId: verifyNote
      description: Same read rule as getNote. Recomputes content_hash from the stored content and rebuilds the project × organization chain. DRAFT notes have nothing to verify (409 CONFLICT).
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteVerification" }
              examples: { default: { $ref: "#/components/examples/NoteVerification" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

