openapi: 3.1.0
info:
  title: NAIS AI-OS / Research Commons API
  version: 1.4.0
  description: |
    P0 contract. Owner: Agent 0 (Platform). Changes only via CONTRACT_CHANGE_REQUEST.md.

    Conventions
    - Base path `/api/v1`, served behind gateway `http://localhost:21051`.
    - IDs are opaque UUID (v7 recommended). Times are UTC ISO 8601.
    - Errors use `ErrorEnvelope`; codes are listed in `contracts/error_codes.json`.
    - List endpoints use cursor pagination (`cursor`, `limit` default 20, max 100).
    - Every response carries `X-Request-Id`; `error.trace_id` equals the OpenTelemetry trace id.
    - "Not visible" resources return 404 (not 403) to avoid existence leaks, except where noted.
servers:
  - url: http://localhost:21051/api/v1
security:
  - bearerAuth: []
tags:
  - name: health
  - name: identity
  - name: projects
  - name: catalog
  - name: governance
  - name: readiness
  - name: audit
  - name: notifications

paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      security: []
      responses:
        "200": { description: Process alive, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      security: []
      responses:
        "200": { description: All dependencies reachable, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: A dependency is down, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }

  # ---------------------------------------------------------------- identity (M01)
  /me:
    get:
      tags: [identity]
      operationId: getMe
      description: Returns the caller. First call of a session provisions the user (JIT) and emits identity.user.logged_in.v1.
      responses:
        "200": { description: Caller profile, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "JIT provisioning email conflict (CONFLICT)" }
    patch:
      tags: [identity]
      operationId: updateMe
      description: Self-service profile fields. `national_researcher_number` is the NTIS 국가연구자번호 (8 digits); null clears it. Emits identity.user.updated.v1.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MeUpdate" } } }
      responses:
        "200": { description: Updated caller, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "NTIS number already registered by another user (CONFLICT)" }
        "422": { $ref: "#/components/responses/Error" }
  /users:
    get:
      tags: [identity]
      operationId: listUsers
      description: Directory search for inviting members. Returns only ACTIVE users with an ACTIVE membership.
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2 }, description: Matches display_name or email prefix }
        - { name: organization_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/IdentityPublicProfile" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /users/{user_id}/transfer:
    parameters: [ { $ref: "#/components/parameters/UserId" } ]
    post:
      tags: [identity]
      operationId: transferUserOrganization
      description: PLATFORM_ADMIN only. Ends the user's current membership (kept as history) and starts one in organization_id; updates the Keycloak org_code attribute. Emits identity.membership.changed.v1 for both memberships. Same target org = idempotent 200.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserTransfer" } } }
      responses:
        "200": { description: New current membership, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationMembership" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error", description: "Keycloak admin API unavailable (DEPENDENCY_UNAVAILABLE); nothing changed" }
  /organizations:
    get:
      tags: [identity]
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/OrganizationSummary" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}:
    parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
    get:
      tags: [identity]
      operationId: getOrganization
      responses:
        "200": { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/members:
    parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
    get:
      tags: [identity]
      operationId: listOrganizationMembers
      description: ORG_ADMIN of the organization or PLATFORM_ADMIN only.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/OrganizationMembership" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [identity]
      operationId: updateOrganizationMember
      description: ORG_ADMIN / PLATFORM_ADMIN. Emits identity.membership.changed.v1. Disabling a membership triggers grant revocation (MEMBERSHIP_DISABLED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" }, uniqueItems: true }
                status: { $ref: "#/components/schemas/ActiveStatus" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationMembership" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- projects (M02)
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      description: Projects the caller is a member of, plus PUBLIC projects when `scope=discover`.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, discover], default: mine } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProjectStatus" } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectSummary" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: createProject
      description: Caller becomes PROJECT_OWNER; caller's organization becomes lead organization.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [projects]
      operationId: getProject
      description: Members only. Non-members get 404 for PRIVATE and 403 FORBIDDEN for PUBLIC.
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: updateProject
      description: PROJECT_OWNER / PROJECT_ADMIN.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/archive:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    post:
      tags: [projects]
      operationId: archiveProject
      description: PROJECT_OWNER only. Emits project.archived.v1; governance revokes all project-scoped grants.
      responses:
        "200": { description: Archived, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/members:
    parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
    get:
      tags: [projects]
      operationId: listProjectMembers
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: addProjectMember
      description: PROJECT_OWNER / PROJECT_ADMIN. Cross-organization users allowed. P0 adds directly (ACTIVE) and notifies (D-007).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, role]
              properties:
                user_id: { $ref: "#/components/schemas/Id" }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{project_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [projects]
      operationId: updateProjectMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: removeProjectMember
      description: PROJECT_OWNER / PROJECT_ADMIN, or the member themself (leave). Emits project.member.removed.v1.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- catalog (M03)
  /datasets:
    get:
      tags: [catalog]
      operationId: searchDatasets
      description: OpenSearch-backed metadata search. Visibility per D-012. Search p95 < 1.5s.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: access_level, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AccessLevel" } } }
        - { name: owner_organization_id, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/Id" } } }
        - { name: purpose, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/Purpose" } } }
        - { name: keyword, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: readiness_status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/ReadinessOverall" } } }
        - { name: subject, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: SUBJECT vocabulary codes (any of) }
        - { name: material, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: method, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: collecting_organization_id, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/Id" } } }
        - { name: principal_investigator_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: temporal_from, in: query, schema: { type: string, format: date }, description: "Data period overlap: dataset temporal_end >= temporal_from (missing end = open-ended)" }
        - { name: temporal_to, in: query, schema: { type: string, format: date }, description: "Data period overlap: dataset temporal_start <= temporal_to" }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, updated_desc, title_asc], default: relevance } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Results, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetSearchResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [catalog]
      operationId: createDataset
      description: DATA_STEWARD of owner_organization_id only (D-013).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: getDataset
      responses:
        "200": { description: Dataset, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [catalog]
      operationId: updateDataset
      description: Owner-org DATA_STEWARD. Policy/access_level changes emit POLICY_CHANGED events. Existing grants are not altered by policy changes.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/policy:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: getDatasetPolicy
      description: Read model consumed by governance and web.
      responses:
        "200": { description: Policy view, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetPolicyView" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/contributors:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: listDatasetContributors
      description: Visible datasets only (D-012). Each contributor carries the affiliation at the time they were added.
      responses:
        "200": { description: Contributors, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DatasetContributor" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [catalog]
      operationId: putDatasetContributors
      description: Owner-org DATA_STEWARD. Replaces the whole list; unchanged (user_id, role) pairs keep their stored affiliation. Emits catalog.dataset.metadata_changed.v1 when the list changes.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetContributorsPut" } } }
      responses:
        "200": { description: Contributors, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DatasetContributor" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/metadata.jsonld:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: getDatasetJsonLd
      description: Machine-readable metadata (schema.org Dataset + DCAT + PROV context) for M11 / AI use. Visibility per D-012. Emails only when contact_email_public.
      responses:
        "200":
          description: JSON-LD document
          content:
            application/ld+json: { schema: { $ref: "#/components/schemas/DatasetJsonLd" } }
            application/json: { schema: { $ref: "#/components/schemas/DatasetJsonLd" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /vocabulary/{scheme}:
    parameters:
      - { name: scheme, in: path, required: true, schema: { $ref: "#/components/schemas/VocabularyScheme" } }
    get:
      tags: [catalog]
      operationId: listVocabulary
      description: All active terms of a controlled vocabulary (no pagination), ordered by parent_code then code.
      responses:
        "200": { description: Terms, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/VocabularyTerm" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [catalog]
      operationId: createVocabularyTerm
      description: PLATFORM_ADMIN only. Adds a term (code unique within the scheme).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VocabularyTermCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/VocabularyTerm" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/versions:
    parameters: [ { $ref: "#/components/parameters/DatasetId" } ]
    get:
      tags: [catalog]
      operationId: listDatasetVersions
      description: Non-stewards see only PUBLISHED versions.
      responses:
        "200": { description: Versions, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DatasetVersion" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [catalog]
      operationId: createDatasetVersion
      description: Owner-org DATA_STEWARD. Creates a DRAFT version branched from the latest PUBLISHED version (zero-copy file inheritance, spec §3.3b). Several drafts may exist at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version_label]
              properties:
                version_label: { type: string, pattern: "^[A-Za-z0-9._-]{1,32}$", examples: ["v1", "2026.09"] }
                change_note: { type: string, maxLength: 2000 }
                from_version_id: { $ref: "#/components/schemas/Id", description: "PUBLISHED version of this dataset whose files the draft inherits without re-upload (revert = an older version). Default: the latest PUBLISHED version." }
                empty: { type: boolean, default: false, description: "Start without files (still based on the latest PUBLISHED version). Mutually exclusive with from_version_id." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    get:
      tags: [catalog]
      operationId: getDatasetVersion
      description: Includes file manifest (names, sizes, checksums) - manifest is metadata, not data.
      responses:
        "200": { description: Version, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [catalog]
      operationId: updateDatasetVersion
      description: Owner-org DATA_STEWARD. DRAFT only. Sets the change note (required at publish).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersionUpdate" } } }
      responses:
        "200": { description: Version, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [catalog]
      operationId: discardDatasetVersion
      description: Owner-org DATA_STEWARD. Deletes a DRAFT version, its upload sessions and files. Stored objects are removed only when no other version references them.
      responses:
        "204": { description: Discarded }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/rebase:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [catalog]
      operationId: rebaseDatasetVersion
      description: >-
        Owner-org DATA_STEWARD. DRAFT only. Re-applies the draft's changes on top of the latest PUBLISHED version.
        Paths changed on both sides need a resolution (MINE keeps the draft's file, THEIRS takes the latest version's);
        without one the call returns 409 CONFLICT with details.conflicts and changes nothing.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/RebaseRequest" } } }
      responses:
        "200": { description: Rebased draft, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/diff:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
      - { name: against, in: query, required: false, schema: { $ref: "#/components/schemas/Id" }, description: "Default: base_version_id for a DRAFT, previous_version_id otherwise (none -> everything ADDED)" }
    get:
      tags: [catalog]
      operationId: compareDatasetVersions
      description: Three-layer comparison (files, schema from column profiles - no raw values, metadata snapshot). Both versions must be visible and belong to the same dataset.
      responses:
        "200": { description: Diff, content: { application/json: { schema: { $ref: "#/components/schemas/VersionDiff" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /datasets/{dataset_id}/file-history:
    parameters:
      - { $ref: "#/components/parameters/DatasetId" }
      - { name: path, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._/-]{1,512}$" } }
    get:
      tags: [catalog]
      operationId: getFileHistory
      description: State of one path in every PUBLISHED/WITHDRAWN version the caller can see, oldest first.
      responses:
        "200": { description: History, content: { application/json: { schema: { $ref: "#/components/schemas/FileHistory" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/citation:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
      - { name: style, in: query, required: false, schema: { $ref: "#/components/schemas/CitationStyle" } }
    get:
      tags: [catalog]
      operationId: getDatasetCitation
      responses:
        "200": { description: Citation, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetCitation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/upload-session:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [catalog]
      operationId: createUploadSession
      description: Owner-org DATA_STEWARD, DRAFT version only. Returns presigned PUT URLs (multipart above 64 MiB). Session TTL 1h.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadSessionCreate" } } }
      responses:
        "201": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /upload-sessions/{upload_session_id}:
    parameters:
      - { name: upload_session_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    get:
      tags: [catalog]
      operationId: getUploadSession
      description: Owner-org DATA_STEWARD. Poll file verification status. Presigned URLs are omitted after the session is COMPLETED/EXPIRED.
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/files/{file_id}:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
      - { name: file_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    delete:
      tags: [catalog]
      operationId: deleteDraftFile
      description: Owner-org DATA_STEWARD, DRAFT version only. Removes manifest row and stored object.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /upload-sessions/{upload_session_id}/complete:
    parameters:
      - { name: upload_session_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [catalog]
      operationId: completeUploadSession
      description: Completes multipart uploads and verifies size + sha256 (D-014). Files <= 256 MiB are verified synchronously (VERIFIED/FAILED in the response); larger files return UPLOADED and are verified asynchronously by the worker — poll getUploadSession. Files failing verification are marked FAILED with failure_code and deleted from storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parts:
                  type: array
                  description: Required for multipart files.
                  items:
                    type: object
                    required: [file_id, etags]
                    properties:
                      file_id: { $ref: "#/components/schemas/Id" }
                      etags: { type: array, items: { type: object, required: [part_number, etag], properties: { part_number: { type: integer, minimum: 1 }, etag: { type: string } } } }
      responses:
        "200": { description: Session result, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/publish:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [catalog]
      operationId: publishDatasetVersion
      description: Owner-org DATA_STEWARD. Requires >=1 file and all files VERIFIED. Version becomes immutable. Emits catalog.dataset.version_published.v1.
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dataset-files/{file_id}/profile:
    parameters: [ { name: file_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } } ]
    get:
      tags: [catalog]
      operationId: getFileProfile
      description: Data Explorer column summary of a tabular file (names, types, units, descriptions, concept IRIs, missing ratio, distinct count). Visible to everyone who can see the version; never contains raw values (D-018).
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/FileProfile" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dataset-files/{file_id}/preview:
    parameters: [ { name: file_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } } ]
    get:
      tags: [catalog]
      operationId: getFilePreview
      description: Data Explorer distributions (histograms, min/max/mean, top values) and the first 100 rows (cells ≤ 200 chars). Requires download permission (owner organization member, PUBLIC dataset, ACTIVE grant, PLATFORM_ADMIN); otherwise 403 with details.reason DOWNLOAD_PERMISSION_REQUIRED.
      responses:
        "200": { description: Preview, content: { application/json: { schema: { $ref: "#/components/schemas/FilePreview" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- governance (M04)
  /access-requests:
    get:
      tags: [governance]
      operationId: listAccessRequests
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [requester, reviewer], default: requester }, description: "requester = my requests; reviewer = requests for datasets owned by orgs where I am DATA_STEWARD" }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AccessRequestStatus" } } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: dataset_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [governance]
      operationId: createAccessRequest
      description: Creates in SUBMITTED (D-015). Caller must be an ACTIVE member of project_id with role other than VIEWER (VIEWER -> FORBIDDEN). Project must be ACTIVE.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestCreate" } } }
      responses:
        "201": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    get:
      tags: [governance]
      operationId: getAccessRequest
      description: Visible to requester and owner-org DATA_STEWARD/ORG_ADMIN. Read-only, no state change (D-025).
      responses:
        "200": { description: Request, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/start-review:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: startAccessReview
      description: Owner-org DATA_STEWARD (not the requester). SUBMITTED -> UNDER_REVIEW, emits governance.access.review_started.v1. Idempotent for UNDER_REVIEW. Optional — approve/reject/request-changes also accept SUBMITTED (D-025).
      responses:
        "200": { description: Under review, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/approve:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: approveAccessRequest
      description: Owner-org DATA_STEWARD. Allowed from SUBMITTED/UNDER_REVIEW. Creates ACTIVE grant.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessApprove" } } }
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/reject:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: rejectAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/request-changes:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: requestAccessChanges
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [comment], properties: { comment: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: Changes requested, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/resubmit:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: resubmitAccessRequest
      description: Requester only, from CHANGE_REQUESTED. Fields omitted keep previous values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                purpose: { $ref: "#/components/schemas/Purpose" }
                purpose_detail: { type: string, minLength: 20, maxLength: 4000 }
                operations: { type: array, items: { $ref: "#/components/schemas/Operation" }, minItems: 1, uniqueItems: true }
                requested_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200": { description: Resubmitted, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-requests/{access_request_id}/withdraw:
    parameters: [ { $ref: "#/components/parameters/AccessRequestId" } ]
    post:
      tags: [governance]
      operationId: withdrawAccessRequest
      description: Requester only, from SUBMITTED/UNDER_REVIEW/CHANGE_REQUESTED.
      responses:
        "200": { description: Withdrawn, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-grants:
    get:
      tags: [governance]
      operationId: listAccessGrants
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [subject, owner], default: subject }, description: "subject = grants I hold; owner = grants on my org's datasets (DATA_STEWARD/ORG_ADMIN)" }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AccessGrantStatus" } } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: dataset_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AccessGrant" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /access-grants/{access_grant_id}/revoke:
    parameters:
      - { name: access_grant_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [governance]
      operationId: revokeAccessGrant
      description: Owner-org DATA_STEWARD / ORG_ADMIN. Effective immediately for new download sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrant" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/download-session:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [governance]
      operationId: createDownloadSession
      description: |
        Order (01_ARCHITECTURE §7): version PUBLISHED → basis (PUBLIC / OWNER_ORGANIZATION / GRANT) → for GRANT: active grant for (caller, project, dataset),
        operation READ, not expired, caller still ACTIVE project member → OPA decision → presigned GET URLs (TTL 300s).
        Every outcome is audited (authorized/denied).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DownloadSessionCreate" } } }
      responses:
        "201": { description: Signed URLs, content: { application/json: { schema: { $ref: "#/components/schemas/DownloadSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- readiness (M05)
  /readiness-profiles:
    get:
      tags: [readiness]
      operationId: listReadinessProfiles
      responses:
        "200": { description: Profiles, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ReadinessProfile" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/readiness-validations:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    post:
      tags: [readiness]
      operationId: startReadinessValidation
      description: Owner-org DATA_STEWARD. PUBLISHED versions only. Same input fingerprint + profile version returns the existing COMPLETED result (200) instead of re-running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [profile_id], properties: { profile_id: { type: string, examples: ["GENERIC_BASIC", "TABULAR_ML_BASIC"] } } }
      responses:
        "200": { description: Existing identical result, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessValidation" } } } }
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessValidation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /dataset-versions/{version_id}/readiness:
    parameters: [ { $ref: "#/components/parameters/VersionId" } ]
    get:
      tags: [readiness]
      operationId: getReadiness
      description: Latest validation per profile for this version. Visible to anyone who can see the dataset metadata. No results yet -> 200 with empty items; profile_id given but never run -> 404 READINESS_NOT_AVAILABLE.
      parameters:
        - { name: profile_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Latest results, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ReadinessValidation" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- audit & notifications (M09)
  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      description: |
        Scope: PLATFORM_ADMIN all; ORG_ADMIN/DATA_STEWARD events where actor org or resource owner org is theirs;
        other users: own actions, plus events of projects they are members of when project_id is given.
      parameters:
        - { name: action, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AuditAction" } } }
        - { name: actor_user_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: organization_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: project_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: resource_type, in: query, schema: { $ref: "#/components/schemas/ResourceType" } }
        - { name: resource_id, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit events (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Caller's notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                      unread_count: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /notifications/{notification_id}/read:
    parameters:
      - { name: notification_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [notifications]
      operationId: markNotificationRead
      responses:
        "200": { description: Marked, content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      responses:
        "204": { description: All marked read }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm `nais` access token. Required claims sub, email, name, org_code; audience nais-api.

  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    OrganizationId: { name: organization_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    UserId: { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    ProjectId: { name: project_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    DatasetId: { name: dataset_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    VersionId: { name: version_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    AccessRequestId: { name: access_request_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }

  responses:
    Error:
      description: Error envelope. See contracts/error_codes.json for codes and HTTP mapping.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    # ---------- shared
    Id: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: { type: string, examples: ["ACCESS_GRANT_EXPIRED"] }
            message: { type: string }
            trace_id: { type: string }
            details: { type: object, additionalProperties: true }
    PageEnvelope:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: {} }
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks: { type: object, additionalProperties: { type: string, enum: [ok, down] } }

    # ---------- enums
    ActiveStatus: { type: string, enum: [ACTIVE, DISABLED] }
    OrganizationType: { type: string, enum: [RESEARCH_INSTITUTE, UNIVERSITY, COMPANY, PLATFORM_OPERATOR] }
    OrgRole: { type: string, enum: [ORG_ADMIN, DATA_STEWARD, RESOURCE_MANAGER] }
    PlatformRole: { type: string, enum: [PLATFORM_ADMIN] }
    ProjectRole: { type: string, enum: [PROJECT_OWNER, PROJECT_ADMIN, RESEARCHER, VIEWER] }
    ProjectStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    ProjectVisibility: { type: string, enum: [PRIVATE, PUBLIC] }
    AccessLevel: { type: string, enum: [PUBLIC, INTERNAL, CONTROLLED, SENSITIVE] }
    Purpose: { type: string, enum: [ACADEMIC_RESEARCH, AI_TRAINING, COMMERCIAL_RESEARCH, EDUCATION, PUBLIC_INTEREST] }
    Operation: { type: string, enum: [READ, COMPUTE, WRITE], description: "P0 grantable: READ only (D-009)" }
    DatasetStatus: { type: string, enum: [ACTIVE, WITHDRAWN] }
    DatasetVersionStatus: { type: string, enum: [DRAFT, PUBLISHED, WITHDRAWN] }
    FileStatus: { type: string, enum: [PENDING, UPLOADED, VERIFIED, FAILED] }
    AccessRequestStatus: { type: string, enum: [DRAFT, SUBMITTED, UNDER_REVIEW, CHANGE_REQUESTED, APPROVED, REJECTED, WITHDRAWN] }
    AccessGrantStatus: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }
    ReadinessRunStatus: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED] }
    ReadinessOverall: { type: string, enum: [PASS, WARNING, FAIL] }
    ReadinessCheckStatus: { type: string, enum: [PASS, WARNING, FAIL, NOT_APPLICABLE] }
    ResourceType: { type: string, enum: [USER, ORGANIZATION, MEMBERSHIP, PROJECT, PROJECT_MEMBER, DATASET, DATASET_VERSION, DATASET_FILE, ACCESS_REQUEST, ACCESS_GRANT, READINESS_VALIDATION] }
    AuditAction:
      type: string
      enum: [LOGIN, USER_CREATED, ORGANIZATION_CREATED, ADMIN_ROLE_CHANGED, PROJECT_CREATED, PROJECT_ARCHIVED, PROJECT_MEMBER_ADDED, PROJECT_MEMBER_REMOVED, PROJECT_MEMBER_ROLE_CHANGED,
             DATASET_CREATED, DATASET_VERSION_PUBLISHED, DATASET_UPDATED, POLICY_CHANGED, ACCESS_REQUESTED, ACCESS_REVIEW_STARTED, ACCESS_APPROVED, ACCESS_REJECTED, ACCESS_CHANGES_REQUESTED, ACCESS_WITHDRAWN,
             ACCESS_REVOKED, ACCESS_EXPIRED, FILE_DOWNLOADED, DOWNLOAD_DENIED, READINESS_VALIDATION_COMPLETED]
    NotificationType:
      type: string
      enum: [PROJECT_INVITATION, ACCESS_SUBMITTED, ACCESS_APPROVED, ACCESS_REJECTED, ACCESS_CHANGES_REQUESTED, ACCESS_EXPIRING, ACCESS_REVOKED, DATASET_PUBLISHED]

    # ---------- identity read models
    IdentityPublicProfile:
      type: object
      required: [user_id, display_name, organization_id, status]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        organization_id: { $ref: "#/components/schemas/Id" }
        organization_name: { type: string }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        national_researcher_number: { type: [string, "null"], pattern: "^[0-9]{8}$" }
    OrganizationSummary:
      type: object
      required: [organization_id, code, name, type]
      properties:
        organization_id: { $ref: "#/components/schemas/Id" }
        code: { type: string, pattern: "^[a-z0-9-]{2,32}$", examples: ["inst-a"] }
        name: { type: string }
        type: { $ref: "#/components/schemas/OrganizationType" }
    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationSummary"
        - type: object
          properties:
            ror_id: { type: [string, "null"], description: "P2 extension" }
            homepage_url: { type: [string, "null"], format: uri }
            member_count: { type: integer }
            dataset_count: { type: integer }
            created_at: { $ref: "#/components/schemas/Timestamp" }
    OrganizationMembership:
      type: object
      required: [user_id, organization_id, roles, status]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        organization_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" } }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
    Me:
      type: object
      required: [user_id, display_name, email, status, organization, org_roles, platform_roles]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        org_roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" } }
        platform_roles: { type: array, items: { $ref: "#/components/schemas/PlatformRole" } }
        national_researcher_number: { type: [string, "null"], pattern: "^[0-9]{8}$" }

    MeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        national_researcher_number: { type: [string, "null"], pattern: "^[0-9]{8}$", description: "NTIS 국가연구자번호; null clears" }
    UserTransfer:
      type: object
      additionalProperties: false
      required: [organization_id]
      properties:
        organization_id: { $ref: "#/components/schemas/Id" }
        roles: { type: array, items: { $ref: "#/components/schemas/OrgRole" }, uniqueItems: true, default: [] }
    # ---------- projects
    ProjectSummary:
      type: object
      required: [project_id, name, status, lead_organization_id, visibility]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        visibility: { $ref: "#/components/schemas/ProjectVisibility" }
        lead_organization_id: { $ref: "#/components/schemas/Id" }
        my_role: { oneOf: [ { $ref: "#/components/schemas/ProjectRole" }, { type: "null" } ] }
        lead_organization_name: { type: string }
        member_count: { type: integer }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          required: [description, organizations, created_at]
          properties:
            description: { type: string }
            keywords: { type: array, items: { type: string } }
            start_date: { type: [string, "null"], format: date }
            end_date: { type: [string, "null"], format: date }
            organizations:
              type: array
              items:
                type: object
                required: [organization_id, role]
                properties:
                  organization_id: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  role: { type: string, enum: [LEAD, PARTNER], description: "PARTNER rows are derived from members' organizations" }
            created_by: { $ref: "#/components/schemas/Id" }
            created_at: { $ref: "#/components/schemas/Timestamp" }
            archived_at: { type: [string, "null"], format: date-time }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        visibility: { $ref: "#/components/schemas/ProjectVisibility" }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 20 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        visibility: { $ref: "#/components/schemas/ProjectVisibility" }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 20 }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
    ProjectMember:
      type: object
      required: [project_id, user_id, organization_id, role, joined_at]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        organization_id: { $ref: "#/components/schemas/Id" }
        organization_name: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        joined_at: { $ref: "#/components/schemas/Timestamp" }
        added_by: { $ref: "#/components/schemas/Id" }

    # ---------- catalog
    DatasetPolicyView:
      type: object
      required: [dataset_id, owner_organization_id, access_level, allowed_purposes, approval_required, max_grant_days]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" }, minItems: 1 }
        approval_required: { type: boolean, description: "P0: always true for CONTROLLED/SENSITIVE; ignored for PUBLIC/INTERNAL" }
        max_grant_days: { type: integer, minimum: 1, maximum: 365, description: "SENSITIVE <= 30" }
    VocabularyScheme: { type: string, enum: [SUBJECT, METHOD, MATERIAL] }
    UpdateFrequency: { type: string, enum: [ONCE, MONTHLY, QUARTERLY, YEARLY, IRREGULAR] }
    ContributorRole: { type: string, enum: [CO_INVESTIGATOR, DATA_COLLECTOR, DATA_CURATOR] }
    VocabularyTerm:
      type: object
      required: [scheme, code, label_ko, label_en]
      properties:
        scheme: { $ref: "#/components/schemas/VocabularyScheme" }
        code: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }
        label_ko: { type: string }
        label_en: { type: string }
        iri: { type: [string, "null"], pattern: "^https?://\\S+$" }
        parent_code: { type: [string, "null"] }
    VocabularyTermCreate:
      type: object
      additionalProperties: false
      required: [code, label_ko, label_en]
      properties:
        code: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }
        label_ko: { type: string, minLength: 1, maxLength: 200 }
        label_en: { type: string, minLength: 1, maxLength: 200 }
        iri: { type: string, pattern: "^https?://\\S+$" }
        parent_code: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }
    OrganizationRef:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ], description: "null for an organization outside the council (free-text name)" }
        name: { type: string }
    DatasetPerson:
      type: object
      required: [user_id, display_name, status, affiliation]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        national_researcher_number: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ActiveStatus" }
        affiliation: { $ref: "#/components/schemas/OrganizationRef", description: "Organization at the time the person was assigned (당시 소속)" }
        current_organization: { oneOf: [ { $ref: "#/components/schemas/OrganizationRef" }, { type: "null" } ], description: "Current organization (null if unknown)" }
        email: { type: string, format: email, description: "Only on people.steward_contact and only when contact_email_public" }
    DatasetContributor:
      allOf:
        - $ref: "#/components/schemas/DatasetPerson"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/ContributorRole" }
    DatasetContributorsPut:
      type: object
      additionalProperties: false
      required: [contributors]
      properties:
        contributors:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [user_id, role]
            properties:
              user_id: { $ref: "#/components/schemas/Id" }
              role: { $ref: "#/components/schemas/ContributorRole" }
    DatasetPeople:
      type: object
      required: [principal_investigator, steward_contact, contributors, steward_contact_absent]
      properties:
        principal_investigator: { oneOf: [ { $ref: "#/components/schemas/DatasetPerson" }, { type: "null" } ] }
        steward_contact: { oneOf: [ { $ref: "#/components/schemas/DatasetPerson" }, { type: "null" } ] }
        contributors: { type: array, items: { $ref: "#/components/schemas/DatasetContributor" } }
        steward_contact_absent: { type: boolean, description: "Steward contact unset, disabled, or no longer a member of the owner organization (담당자 재지정 필요)" }
    RelatedPublication:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        doi: { type: string, pattern: "^10\\.\\d{4,9}/\\S+$" }
        url: { type: string, pattern: "^https?://\\S+$" }
    DatasetJsonLd:
      type: object
      required: ["@context", "@type", "@id", name]
      additionalProperties: true
      properties:
        "@context": { type: object }
        "@type": { type: array, items: { type: string } }
        "@id": { type: string, format: uri }
        name: { type: string }
    FilePreviewStatus: { type: string, enum: [PENDING, READY, FAILED, UNSUPPORTED] }
    ColumnProfile:
      type: object
      required: [name, type, missing_ratio, distinct_count]
      properties:
        name: { type: string }
        type: { type: string, enum: [string, integer, number, boolean, date, datetime], description: "Declared in _schema.json, else inferred from the sample" }
        unit: { type: [string, "null"] }
        description: { type: [string, "null"] }
        concept_iri: { type: [string, "null"] }
        missing_ratio: { type: number, minimum: 0, maximum: 1 }
        distinct_count: { type: integer, minimum: 0 }
        distinct_capped: { type: boolean, description: "true when distinct values exceeded the 1,000 counting cap (distinct_count is then a lower bound)" }
    FileProfile:
      type: object
      required: [file_id, path, status, columns]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        path: { type: string }
        status: { $ref: "#/components/schemas/FilePreviewStatus" }
        failure_code: { type: [string, "null"], enum: [UNPARSEABLE, TIMEOUT, GENERATION_FAILED, null] }
        generated_at: { type: [string, "null"], format: date-time }
        format: { type: string, enum: [csv, tsv, parquet] }
        rows_sampled: { type: integer }
        total_rows: { type: [integer, "null"], description: "Exact row count when known (parquet metadata, or a CSV/TSV read to the end)" }
        truncated: { type: boolean, description: "Sample stopped at the row/byte limit" }
        columns_truncated: { type: boolean }
        columns: { type: array, items: { $ref: "#/components/schemas/ColumnProfile" } }
    ColumnDistribution:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [numeric, categorical, other] }
        min: { type: [number, "null"] }
        max: { type: [number, "null"] }
        mean: { type: [number, "null"] }
        histogram:
          type: array
          items: { type: object, required: [lower, upper, count], properties: { lower: { type: number }, upper: { type: number }, count: { type: integer } } }
        top_values:
          type: array
          items: { type: object, required: [value, count], properties: { value: { type: string }, count: { type: integer } } }
    FilePreview:
      type: object
      required: [file_id, status, header, rows, rows_truncated, columns]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/FilePreviewStatus" }
        header: { type: array, items: { type: string } }
        rows: { type: array, maxItems: 100, items: { type: array, items: { type: [string, "null"], maxLength: 200 } } }
        rows_truncated: { type: boolean }
        columns: { type: array, items: { $ref: "#/components/schemas/ColumnDistribution" } }
    DatasetCreate:
      type: object
      additionalProperties: false
      required: [owner_organization_id, title, description, access_level, license, allowed_purposes, principal_investigator_id, data_steward_contact_id]
      properties:
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        title: { type: string, minLength: 3, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 30 }
        domain: { type: string, examples: ["materials", "bio", "energy"] }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        license: { type: string, examples: ["CC-BY-4.0", "NAIS-CONTROLLED-1.0"] }
        usage_policy: { type: string, maxLength: 10000 }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" }, minItems: 1, uniqueItems: true }
        max_grant_days: { type: integer, minimum: 1, maximum: 365, default: 180 }
        contact_email: { type: string, format: email }
        provenance: { type: string, maxLength: 10000, description: "How the data was produced (instrument, method, source)" }
        subtitle: { type: string, maxLength: 160, description: "One-line summary shown under the title (Data Card)" }
        principal_investigator_id: { $ref: "#/components/schemas/Id" }
        data_steward_contact_id: { $ref: "#/components/schemas/Id" }
        contact_email_public: { type: boolean, default: false }
        project_title: { type: string, maxLength: 300 }
        project_code: { type: string, maxLength: 64 }
        funding_agency: { type: string, maxLength: 200 }
        subject_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 5, uniqueItems: true }
        method_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 10, uniqueItems: true }
        material_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 20, uniqueItems: true }
        method_detail: { type: string, maxLength: 4000 }
        temporal_start: { type: string, format: date }
        temporal_end: { type: string, format: date }
        collecting_organization_id: { $ref: "#/components/schemas/Id" }
        collecting_organization_name: { type: string, minLength: 1, maxLength: 200 }
        update_frequency: { $ref: "#/components/schemas/UpdateFrequency" }
        related_publications: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RelatedPublication" } }
    DatasetUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 30 }
        domain: { type: string }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        license: { type: string }
        usage_policy: { type: string, maxLength: 10000 }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" }, minItems: 1, uniqueItems: true }
        max_grant_days: { type: integer, minimum: 1, maximum: 365 }
        contact_email: { type: string, format: email }
        provenance: { type: string, maxLength: 10000 }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        subtitle: { type: [string, "null"], maxLength: 160 }
        principal_investigator_id: { $ref: "#/components/schemas/Id" }
        data_steward_contact_id: { $ref: "#/components/schemas/Id" }
        contact_email_public: { type: boolean }
        project_title: { type: [string, "null"], maxLength: 300 }
        project_code: { type: [string, "null"], maxLength: 64 }
        funding_agency: { type: [string, "null"], maxLength: 200 }
        subject_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 5, uniqueItems: true }
        method_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 10, uniqueItems: true }
        material_codes: { type: array, items: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }, maxItems: 20, uniqueItems: true }
        method_detail: { type: [string, "null"], maxLength: 4000 }
        temporal_start: { type: [string, "null"], format: date }
        temporal_end: { type: [string, "null"], format: date }
        collecting_organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        collecting_organization_name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        update_frequency: { $ref: "#/components/schemas/UpdateFrequency" }
        related_publications: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RelatedPublication" } }
    Dataset:
      type: object
      required: [dataset_id, owner_organization_id, title, description, access_level, license, policy, status, created_at, updated_at]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        owner_organization_name: { type: string }
        title: { type: string }
        description: { type: string }
        keywords: { type: array, items: { type: string } }
        domain: { type: [string, "null"] }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        license: { type: string }
        usage_policy: { type: [string, "null"] }
        contact_email: { type: [string, "null"] }
        provenance: { type: [string, "null"] }
        policy: { $ref: "#/components/schemas/DatasetPolicyView" }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        latest_published_version: { oneOf: [ { $ref: "#/components/schemas/DatasetVersionSummary" }, { type: "null" } ] }
        created_by: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        subtitle: { type: [string, "null"] }
        people: { $ref: "#/components/schemas/DatasetPeople" }
        contact_email_public: { type: boolean }
        project_title: { type: [string, "null"] }
        project_code: { type: [string, "null"] }
        funding_agency: { type: [string, "null"] }
        subject_codes: { type: array, items: { type: string } }
        method_codes: { type: array, items: { type: string } }
        material_codes: { type: array, items: { type: string } }
        method_detail: { type: [string, "null"] }
        temporal_start: { type: [string, "null"], format: date }
        temporal_end: { type: [string, "null"], format: date }
        collecting_organization: { oneOf: [ { $ref: "#/components/schemas/OrganizationRef" }, { type: "null" } ] }
        update_frequency: { $ref: "#/components/schemas/UpdateFrequency" }
        related_publications: { type: array, items: { $ref: "#/components/schemas/RelatedPublication" } }
        stats:
          type: object
          description: Derived from the latest published version (no input)
          properties:
            file_count: { type: integer }
            total_bytes: { type: integer }
            media_types: { type: array, items: { type: string } }
    DatasetVersionSummary:
      type: object
      required: [dataset_version_id, version_label, status]
      properties:
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        version_label: { type: string }
        status: { $ref: "#/components/schemas/DatasetVersionStatus" }
        published_at: { type: [string, "null"], format: date-time }
        readiness_overall:
          description: "Latest COMPLETED result of TABULAR_ML_BASIC if present, else GENERIC_BASIC; null if none"
          oneOf: [ { $ref: "#/components/schemas/ReadinessOverall" }, { type: "null" } ]
    DatasetVersion:
      allOf:
        - $ref: "#/components/schemas/DatasetVersionSummary"
        - type: object
          required: [dataset_id, files, file_count, total_bytes, created_at]
          properties:
            dataset_id: { $ref: "#/components/schemas/Id" }
            change_note: { type: [string, "null"] }
            files: { type: array, items: { $ref: "#/components/schemas/DatasetFile" } }
            file_count: { type: integer }
            total_bytes: { type: integer }
            manifest_sha256: { type: [string, "null"], description: "sha256 over sorted 'path\\tsize\\tsha256' lines; set on publish" }
            created_at: { $ref: "#/components/schemas/Timestamp" }
            created_by: { $ref: "#/components/schemas/Id" }
            base_version_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
            source_version_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
            previous_version_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
            base_is_latest: { type: [boolean, "null"], description: "DRAFT only: base_version_id is the latest PUBLISHED version (publishable without rebase)" }
            change_summary: { oneOf: [ { $ref: "#/components/schemas/ChangeSummary" }, { type: "null" } ] }
    DatasetFile:
      type: object
      required: [file_id, path, size_bytes, sha256, media_type, status]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        path: { type: string, pattern: "^[A-Za-z0-9._/-]{1,512}$", description: "Relative path, no '..' or leading '/'" }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        media_type: { type: string }
        status: { $ref: "#/components/schemas/FileStatus" }
        inherited: { type: boolean, description: "Inherited from the base/source version without re-upload (same stored object)" }
    DatasetVersionUpdate:
      type: object
      additionalProperties: false
      required: [change_note]
      properties:
        change_note: { type: string, minLength: 3, maxLength: 2000 }
    RebaseResolution: { type: string, enum: [MINE, THEIRS] }
    RebaseRequest:
      type: object
      additionalProperties: false
      properties:
        resolutions:
          type: object
          maxProperties: 10000
          additionalProperties: { $ref: "#/components/schemas/RebaseResolution" }
          description: "path -> MINE | THEIRS for conflicting paths"
    ChangeSummary:
      type: object
      required: [added, removed, changed, unchanged]
      properties:
        added: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
    FileChangeStatus: { type: string, enum: [ADDED, REMOVED, CHANGED, UNCHANGED] }
    FileSide:
      type: object
      required: [size_bytes, sha256]
      properties:
        size_bytes: { type: integer }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    FileChange:
      type: object
      required: [path, status, before, after, size_delta]
      properties:
        path: { type: string }
        status: { $ref: "#/components/schemas/FileChangeStatus" }
        before: { oneOf: [ { $ref: "#/components/schemas/FileSide" }, { type: "null" } ] }
        after: { oneOf: [ { $ref: "#/components/schemas/FileSide" }, { type: "null" } ] }
        size_delta: { type: integer }
    ColumnChange:
      type: object
      required: [name, type, unit, missing_ratio]
      properties:
        name: { type: string }
        type: { type: [array, "null"], items: { type: [string, "null"] }, minItems: 2, maxItems: 2 }
        unit: { type: [array, "null"], items: { type: [string, "null"] }, minItems: 2, maxItems: 2 }
        missing_ratio: { type: [array, "null"], items: { type: number }, minItems: 2, maxItems: 2 }
    SchemaChange:
      type: object
      required: [path, status]
      properties:
        path: { type: string }
        status: { type: string, enum: [COMPARED, PROFILE_MISSING] }
        rows: { type: array, items: { type: [integer, "null"] }, minItems: 2, maxItems: 2 }
        columns_added: { type: array, items: { type: string } }
        columns_removed: { type: array, items: { type: string } }
        columns_changed: { type: array, items: { $ref: "#/components/schemas/ColumnChange" } }
    MetadataChange:
      type: object
      required: [field, before, after]
      properties:
        field: { type: string }
        before: {}
        after: {}
    VersionDiff:
      type: object
      required: [from_version_id, to_version_id, summary, files, schema, metadata]
      properties:
        from_version_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        to_version_id: { $ref: "#/components/schemas/Id" }
        summary: { $ref: "#/components/schemas/ChangeSummary" }
        files: { type: array, items: { $ref: "#/components/schemas/FileChange" } }
        schema: { type: array, items: { $ref: "#/components/schemas/SchemaChange" } }
        metadata: { type: array, items: { $ref: "#/components/schemas/MetadataChange" } }
    FileHistoryEntry:
      type: object
      required: [dataset_version_id, version_label, published_at, state]
      properties:
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        version_label: { type: string }
        published_at: { type: string, format: date-time }
        state: { type: string, enum: [ADDED, CHANGED, UNCHANGED, REMOVED, ABSENT] }
        sha256: { type: [string, "null"] }
        size_bytes: { type: [integer, "null"] }
    FileHistory:
      type: object
      required: [dataset_id, path, items]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        path: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/FileHistoryEntry" } }
    CitationStyle: { type: string, enum: [text, bibtex, datacite-json], default: text }
    DatasetCitation:
      type: object
      required: [dataset_version_id, style, content]
      properties:
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        style: { $ref: "#/components/schemas/CitationStyle" }
        content: { type: string, description: "datacite-json: a serialized DataCite 4.5 attributes object" }
    UploadSessionCreate:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [path, size_bytes, sha256, media_type]
            properties:
              path: { type: string, pattern: "^[A-Za-z0-9._/-]{1,512}$" }
              size_bytes: { type: integer, minimum: 1, maximum: 53687091200, description: "P0 per-file limit 50 GiB" }
              sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
              media_type: { type: string }
    UploadSession:
      type: object
      required: [upload_session_id, dataset_version_id, status, expires_at, files]
      properties:
        upload_session_id: { $ref: "#/components/schemas/Id" }
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [OPEN, COMPLETED, EXPIRED] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        files:
          type: array
          items:
            type: object
            required: [file_id, path, status]
            properties:
              file_id: { $ref: "#/components/schemas/Id" }
              path: { type: string }
              status: { $ref: "#/components/schemas/FileStatus" }
              failure_code: { type: [string, "null"] }
              upload:
                oneOf:
                  - type: object
                    required: [method, url]
                    properties:
                      method: { const: PUT }
                      url: { type: string, format: uri }
                      headers: { type: object, additionalProperties: { type: string } }
                  - type: object
                    required: [method, part_size_bytes, parts]
                    properties:
                      method: { const: MULTIPART }
                      part_size_bytes: { type: integer }
                      parts: { type: array, items: { type: object, required: [part_number, url], properties: { part_number: { type: integer }, url: { type: string, format: uri } } } }
    DatasetSearchHit:
      type: object
      required: [dataset_id, title, owner_organization_id, access_level]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        snippet: { type: string }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        owner_organization_name: { type: string }
        access_level: { $ref: "#/components/schemas/AccessLevel" }
        keywords: { type: array, items: { type: string } }
        allowed_purposes: { type: array, items: { $ref: "#/components/schemas/Purpose" } }
        latest_version_label: { type: [string, "null"] }
        readiness_overall: { oneOf: [ { $ref: "#/components/schemas/ReadinessOverall" }, { type: "null" } ] }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        subtitle: { type: [string, "null"] }
        principal_investigator_name: { type: [string, "null"] }
        temporal_start: { type: [string, "null"], format: date }
        temporal_end: { type: [string, "null"], format: date }
        subject_codes: { type: array, items: { type: string } }
        collecting_organization_name: { type: [string, "null"] }
    FacetBucket:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }
    DatasetSearchResult:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [total, facets]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/DatasetSearchHit" } }
            total: { type: integer }
            facets:
              type: object
              properties:
                access_level: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                owner_organization_id: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                purpose: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                keyword: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                readiness_status: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                subject: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                collecting_organization_id: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                material: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }
                method: { type: array, items: { $ref: "#/components/schemas/FacetBucket" } }

    # ---------- governance
    AccessRequestCreate:
      type: object
      additionalProperties: false
      required: [dataset_id, project_id, purpose, purpose_detail, operations, requested_days]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        purpose_detail: { type: string, minLength: 20, maxLength: 4000 }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" }, minItems: 1, uniqueItems: true }
        requested_days: { type: integer, minimum: 1, maximum: 365 }
    AccessRequest:
      type: object
      required: [access_request_id, dataset_id, project_id, requester_user_id, requester_organization_id, owner_organization_id, purpose, purpose_detail, operations, requested_days, status, created_at, updated_at]
      properties:
        access_request_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_title: { type: string }
        project_id: { $ref: "#/components/schemas/Id" }
        project_name: { type: string }
        requester_user_id: { $ref: "#/components/schemas/Id" }
        requester_display_name: { type: string }
        requester_organization_id: { $ref: "#/components/schemas/Id" }
        owner_organization_id: { $ref: "#/components/schemas/Id" }
        purpose: { $ref: "#/components/schemas/Purpose" }
        purpose_detail: { type: string }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        requested_days: { type: integer }
        status: { $ref: "#/components/schemas/AccessRequestStatus" }
        history:
          type: array
          items:
            type: object
            required: [status, at]
            properties:
              status: { $ref: "#/components/schemas/AccessRequestStatus" }
              at: { $ref: "#/components/schemas/Timestamp" }
              by_user_id: { $ref: "#/components/schemas/Id" }
              comment: { type: [string, "null"] }
        access_grant_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AccessApprove:
      type: object
      additionalProperties: false
      required: [grant_days]
      properties:
        grant_days: { type: integer, minimum: 1, maximum: 365, description: "<= requested_days and <= max_grant_days; expires_at = approved_at + grant_days" }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" }, minItems: 1, uniqueItems: true, description: "Subset of requested operations; default = requested" }
        note: { type: string, maxLength: 2000 }
    AccessDecisionResult:
      type: object
      required: [access_request]
      properties:
        access_request: { $ref: "#/components/schemas/AccessRequest" }
        access_grant: { oneOf: [ { $ref: "#/components/schemas/AccessGrant" }, { type: "null" } ] }
    AccessGrant:
      type: object
      required: [access_grant_id, subject_type, subject_user_id, project_id, dataset_id, purpose, operations, valid_from, expires_at, granted_by, policy_version, status]
      properties:
        access_grant_id: { $ref: "#/components/schemas/Id" }
        access_request_id: { $ref: "#/components/schemas/Id" }
        subject_type: { const: USER }
        subject_user_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_title: { type: string }
        subject_display_name: { type: string }
        project_name: { type: string }
        purpose: { $ref: "#/components/schemas/Purpose" }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        valid_from: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        granted_by: { $ref: "#/components/schemas/Id" }
        policy_version: { type: string, examples: ["data_access@1.0.0"] }
        status: { $ref: "#/components/schemas/AccessGrantStatus", description: "Computed: ACTIVE with expires_at <= now is returned as EXPIRED" }
        revoked_at: { type: [string, "null"], format: date-time }
        revoked_by: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        revocation_reason: { type: [string, "null"] }
    DownloadSessionCreate:
      type: object
      additionalProperties: false
      properties:
        project_id: { $ref: "#/components/schemas/Id", description: "Required when basis would be GRANT (CONTROLLED/SENSITIVE for non-owner org)" }
        file_ids: { type: array, items: { $ref: "#/components/schemas/Id" }, minItems: 1, maxItems: 500, description: "Default: all files of the version" }
    DownloadSession:
      type: object
      required: [dataset_version_id, basis, expires_at, files]
      properties:
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        basis: { type: string, enum: [PUBLIC, OWNER_ORGANIZATION, GRANT] }
        access_grant_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        expires_at: { $ref: "#/components/schemas/Timestamp", description: "URL expiry (now + 300s)" }
        files:
          type: array
          items:
            type: object
            required: [file_id, path, url, size_bytes, sha256]
            properties:
              file_id: { $ref: "#/components/schemas/Id" }
              path: { type: string }
              url: { type: string, format: uri }
              size_bytes: { type: integer }
              sha256: { type: string }

    # ---------- readiness
    ReadinessProfile:
      type: object
      required: [profile_id, version, name, checks]
      properties:
        profile_id: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [check_id, severity]
            properties:
              check_id: { type: string }
              severity: { type: string, enum: [REQUIRED, RECOMMENDED], description: "REQUIRED FAIL => overall FAIL; RECOMMENDED FAIL => overall WARNING" }
    ReadinessCheckResult:
      type: object
      required: [check_id, status, severity, message, evidence]
      properties:
        check_id: { type: string }
        status: { $ref: "#/components/schemas/ReadinessCheckStatus" }
        severity: { type: string, enum: [REQUIRED, RECOMMENDED] }
        message: { type: string }
        evidence: { type: object, additionalProperties: true, description: "Statistics/locations only, never raw values (D-018)" }
    ReadinessValidation:
      type: object
      required: [validation_id, dataset_version_id, profile_id, profile_version, run_status, created_at]
      properties:
        validation_id: { $ref: "#/components/schemas/Id" }
        dataset_version_id: { $ref: "#/components/schemas/Id" }
        profile_id: { type: string }
        profile_version: { type: string }
        run_status: { $ref: "#/components/schemas/ReadinessRunStatus" }
        overall_status: { oneOf: [ { $ref: "#/components/schemas/ReadinessOverall" }, { type: "null" } ] }
        summary:
          type: object
          properties:
            pass: { type: integer }
            warning: { type: integer }
            fail: { type: integer }
            not_applicable: { type: integer }
        checks: { type: array, items: { $ref: "#/components/schemas/ReadinessCheckResult" } }
        validator_version: { type: string }
        input_fingerprint: { type: string, description: "sha256(manifest_sha256 + metadata_snapshot_sha256 + profile_id + profile_version + validator_version)" }
        error: { type: [string, "null"], description: "Set when run_status=FAILED" }
        triggered_by: { type: string, enum: [AUTO_ON_PUBLISH, USER] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    # ---------- audit / notification
    AuditEvent:
      type: object
      required: [audit_event_id, occurred_at, action, result, actor, resource, source_event_id, trace_id]
      properties:
        audit_event_id: { $ref: "#/components/schemas/Id" }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        action: { $ref: "#/components/schemas/AuditAction" }
        result: { type: string, enum: [SUCCESS, DENIED] }
        reason: { type: [string, "null"] }
        actor:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [USER, SYSTEM] }
            user_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
            display_name: { type: [string, "null"] }
            organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        resource:
          type: object
          required: [type, id]
          properties:
            type: { $ref: "#/components/schemas/ResourceType" }
            id: { $ref: "#/components/schemas/Id" }
            owner_organization_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        project_id: { oneOf: [ { $ref: "#/components/schemas/Id" }, { type: "null" } ] }
        policy_version: { type: [string, "null"] }
        source_event_id: { $ref: "#/components/schemas/Id" }
        source_event_type: { type: string }
        trace_id: { type: string, description: "= source event correlation_id" }
        details: { type: object, additionalProperties: true }
    Notification:
      type: object
      required: [notification_id, type, title, created_at, read]
      properties:
        notification_id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: "Web route, e.g. /commons/access/{id}" }
        read: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
