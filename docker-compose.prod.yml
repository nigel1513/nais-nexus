# Production override (use as `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`).
# Dev tool ports are removed and the gateway exposes only 21051 (no OpenSearch/OPA). Dev exposure is governed by D-037.
services:
  gateway:
    ports: !override ["21051:21051"]
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  storage-a:
    ports: !reset []
  storage-b:
    ports: !reset []
  mailpit:
    ports: !reset []
  keycloak:
    command: ["start", "--import-realm"]
    # NOTE (Wave 1): the realm import is still the DEV realm (nais-e2e password-grant client + seed users, D-037).
    # Production is not supported before Wave 2 — replace with a prod realm (no test client, no seed users) first.
  web:
    build:
      args:
        NEXT_PUBLIC_API_MOCKING: disabled
    environment:
      NEXT_PUBLIC_API_MOCKING: disabled
