map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 21051;

  # Docker DNS + variable upstreams: gateway starts even if web/keycloak are not deployed yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream      http://api:8000;
  set $web_upstream      http://web:3000;
  set $keycloak_upstream http://keycloak:8080;
  set $storage_a         http://storage-a:8333;
  set $storage_b         http://storage-b:8333;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    client_max_body_size 10m;
    proxy_pass $api_upstream;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;  # never trust a client-supplied chain
    proxy_set_header X-Request-Id      $request_id;
  }

  location /auth/ {
    proxy_pass $keycloak_upstream;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  # Regex, not "location /nais-inst-a/": the prefix form 301-redirects "/nais-inst-a" and S3 clients loop.
  location ~ ^/nais-inst-a(/|$) {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass $storage_a;
    proxy_set_header Host $http_host;
  }

  location ~ ^/nais-inst-b(/|$) {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass $storage_b;
    proxy_set_header Host $http_host;
  }

  location ~ ^/nais-platform(/|$) {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass $storage_a;
    proxy_set_header Host $http_host;
  }

  # Mock-mode presigned storage (web app route): multipart parts exceed 1 MiB, stream them.
  location /mock-storage/ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_intercept_errors on;
    error_page 502 504 = @web_unavailable;
  }

  location @web_unavailable {
    default_type text/plain;
    return 503 "NAIS web portal is not deployed yet.\n";
  }
}

# OpenSearch and OPA have no auth in dev; the gateway fronts them with Basic auth (owner decision D-037).
server {
  listen 21056;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $opensearch_upstream http://opensearch:9200;
  auth_basic "NAIS OpenSearch";
  auth_basic_user_file /etc/nginx/htpasswd;
  client_max_body_size 100m;
  location / {
    proxy_pass $opensearch_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
  }
}

server {
  listen 21057;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $opa_upstream http://opa:8181;
  auth_basic "NAIS OPA";
  auth_basic_user_file /etc/nginx/htpasswd;
  location / {
    proxy_pass $opa_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
  }
}
