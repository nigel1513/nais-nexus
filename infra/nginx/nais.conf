map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 21051;

  # Docker DNS + variable upstreams: gateway starts even if web/keycloak are not deployed yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream      http://api:8000;
  set $web_upstream      http://web:3000;
  set $keycloak_upstream http://keycloak:8080;
  set $storage_a         http://storage-a:8333;
  set $storage_b         http://storage-b:8333;
  set $notebook_upstream http://notebook:8888;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Internal-only endpoints (web server -> api over the docker network): never reachable from outside.
  location ^~ /api/v1/internal/ {
    return 404;
  }

  location /api/ {
    client_max_body_size 10m;
    proxy_pass $api_upstream;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;  # never trust a client-supplied chain
    proxy_set_header X-Request-Id      $request_id;
  }

  # Shared JupyterLab (token-authenticated by Jupyter itself); websockets for kernels.
  # Jupyter's own token is the gate: only the portal's opener (/notebooks-open, after the portal session and project
  # membership checks) hands it out, and Jupyter turns it into a login cookie. No access log, so the ?token= on the
  # first request never lands in a log file. The portal shows these pages in a frame on the project's 노트북 tab
  # (same origin, which Jupyter's own frame-ancestors 'self' allows).
  location /notebooks/ {
    access_log off;
    client_max_body_size 100m;
    proxy_pass $notebook_upstream;
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /auth/ {
    proxy_pass $keycloak_upstream;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  # Regex, not "location /nais-inst-a/": the prefix form 301-redirects "/nais-inst-a" and S3 clients loop.
  location ~ ^/nais-inst-a(/|$) {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass $storage_a;
    proxy_set_header Host $http_host;
  }

  location ~ ^/nais-inst-b(/|$) {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass $storage_b;
    proxy_set_header Host $http_host;
  }

  location ~ ^/nais-platform(/|$) {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass $storage_a;
    proxy_set_header Host $http_host;
  }

  # Mock-mode presigned storage (web app route): multipart parts exceed 1 MiB, stream them.
  location /mock-storage/ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The portal's notebook opener answers with the Jupyter token: nothing logged.
  location = /notebooks-open {
    access_log off;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_intercept_errors on;
    error_page 502 504 = @web_unavailable;
  }

  location @web_unavailable {
    default_type text/plain;
    return 503 "NAIS web portal is not deployed yet.\n";
  }
}

# OpenSearch and OPA have no auth in dev; the gateway fronts them with Basic auth (owner decision D-037).
server {
  listen 21056;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $opensearch_upstream http://192.168.0.2:8005;  # GPU PC 전용 OpenSearch (2026-10-03, nst-regulation과 공유)
  auth_basic "NAIS OpenSearch";
  auth_basic_user_file /etc/nginx/htpasswd;
  client_max_body_size 100m;
  location / {
    proxy_pass $opensearch_upstream;
    proxy_set_header Host $http_host;
    include /etc/nginx/opensearch-auth.conf;  # OpenSearch 보안 플러그인 서비스 계정 (git 제외 파일)
  }
}

server {
  listen 21057;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $opa_upstream http://opa:8181;
  auth_basic "NAIS OPA";
  auth_basic_user_file /etc/nginx/htpasswd;
  location / {
    proxy_pass $opa_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
  }
}
