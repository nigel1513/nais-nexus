name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --frozen
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: typecheck
        run: uv run mypy
      - name: unit + contract tests (testcontainers postgres)
        run: uv run pytest -q
      - name: migration dry-run
        env:
          PYTHONPATH: apps:packages/contracts/python
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci:ci@localhost/nais
        run: uv run python -m api.platform.cli migrate --sql > /dev/null

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run python packages/contracts/generate.py --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: web checks (contracts drift, lint, types, unit)
        working-directory: apps/web
        run: pnpm contracts:check && pnpm lint && pnpm typecheck && pnpm test
      - name: ui package checks
        working-directory: packages/ui
        run: pnpm typecheck && pnpm test
      - name: real-mode build (mock disabled)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_MOCKING: disabled
        run: pnpm build

  gate-a:
    needs: [python, contracts, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --frozen
      - run: scripts/gate_a.sh
      - if: always()
        run: docker compose logs --no-color | tail -300
      - if: always()
        run: docker compose down -v
